<script>window.SB = [{"n":"1","section":"Opening","title":"AI LITERACY","onscreen":"Level 1\nUnderstand AI. Use It Responsibly.","vo":"Welcome to AI Literacy, Level 1. This course gives you a practical foundation for understanding AI, using it responsibly, and knowing where human judgment must remain at the center.","build":"Title animation only. Keep the screen clean and let the narration introduce the course."},{"n":"2","section":"Opening","title":"What you will learn","onscreen":"By the end of this course, you will be able to:\n• Use AI effectively and understand its limitations\n• Use AI responsibly and protect sensitive information\n• Use basic prompting techniques to guide AI outputs\n• Describe what an AI agent is and why its work still needs human review","vo":"By the end of this course, you will be able to use AI effectively while understanding its limitations, use AI responsibly while protecting sensitive information, use basic prompting techniques to guide AI outputs, and describe what an AI agent is and why its work still needs human review.","build":"Reveal the four outcomes one at a time."},{"n":"3","section":"Opening","title":"The learning journey","onscreen":"1  Understand AI\n2  Understand its capabilities and limits\n3  See where AI supports work\n4  Use AI responsibly\n5  Protect information\n6  Prompt with purpose\n7  Experience an AI agent\n8  Demonstrate your judgment","vo":"We will move from understanding AI, to understanding what it can and cannot do, to seeing where it can support work. We will then focus on responsible use, information protection, prompting, and a short experience with an AI agent before you complete the assessment.","build":"Build the journey as a horizontal path. Highlight the current step as the learner progresses."},{"n":"4","section":"Opening","title":"AWARE is your guide","onscreen":"A  Appreciate AI\nW  Weigh the Output\nA  Assess the Risk\nR  Respond with the Right Prompt\nE  Ensure Human Accountability","vo":"AWARE is the mental model that connects the course. Appreciate what AI is and what it can do. Weigh the output rather than accepting it automatically. Assess the risks. Respond with a clear prompt. And ensure that human judgment and accountability stay at the center.","build":"Animate the five letters in sequence. Do not reteach the framework in the content sections. Reference it only through the AWARE cues listed on slides 6, 19, 30, 32, 34, 39 and 51, the assessment feedback layers, and the closing recap. Use the relevant letter as a small visual cue."},{"n":"5","section":"Understanding AI","title":"Understanding AI","onscreen":"What is AI?\nHow does generative AI work at a high level?\nWhat language will you hear when people talk about AI?","vo":"Let us begin with the foundation: what AI is, what generative AI means, and a few terms you need to recognize.","build":""},{"n":"6","section":"Understanding AI","title":"What is Artificial Intelligence?","onscreen":"AI is technology that enables systems to perform tasks that typically require some form of human intelligence.\n\nRecognize patterns  •  Interpret information  •  Generate content  •  Make predictions","vo":"Artificial intelligence is technology that enables systems to perform tasks that typically require some form of human intelligence. Depending on the technology, AI can recognize patterns, interpret information, generate content, and make predictions.","build":"Use a central AI node with four surrounding capability cards. Keep the definition visually dominant.\nAWARE cue: A (Appreciate AI)."},{"n":"7","section":"Understanding AI","title":"AI is a broad field","onscreen":"AI is not one single tool.\n\nDifferent systems can be designed for different capabilities.","vo":"One important point is that AI is a broad field, not one single tool. Different AI systems can be designed for different capabilities. This course focuses on the concepts that apply across AI tools.","build":"Show several simple system tiles feeding into one AI umbrella. Avoid naming products."},{"n":"8","section":"Understanding AI","title":"What is Generative AI?","onscreen":"Generative AI creates new content from instructions and context.\n\nTEXT   IMAGES   AUDIO   VIDEO   CODE","vo":"Generative AI refers to AI that creates new content. Depending on the system, that content can include text, images, audio, video, or code.","build":"Animate the five output types from the center. Keep the definition on screen throughout."},{"n":"9","section":"Understanding AI","title":"What is a Large Language Model?","onscreen":"A large language model (LLM) learns patterns from large amounts of data and uses those patterns to generate language.","vo":"A large language model, or LLM, learns patterns from large amounts of data and uses those patterns to generate language in response to an instruction. It does this by predicting likely language from what it learned in training, which is why fluent output can still be wrong. The important point for Level 1 is that an LLM generates a response based on learned patterns. That does not mean the response has automatically been checked for accuracy.","build":"Show data patterns flowing into a language model and then into a response. Do not imply that the model independently verifies facts."},{"n":"10","section":"Understanding AI","title":"Two terms you will use often","onscreen":"PROMPT\nThe instruction you give AI\n\nCONTEXT\nInformation that helps AI interpret the task","vo":"A prompt is the instruction you give an AI system. Context is the information that helps the system interpret what you need. You will use both ideas again when we cover prompting.","build":"Use two large cards. Reveal prompt first, then context."},{"n":"11","section":"Understanding AI","title":"Three terms to recognize","onscreen":"HALLUCINATION\nAn inaccurate or unsupported AI output\n\nBIAS\nA pattern that can lead to unfair or distorted outcomes\n\nAGENT\nAn AI system configured to carry out a defined task across multiple steps","vo":"A hallucination is an inaccurate or unsupported AI output. Bias can lead to unfair or distorted outcomes. An AI agent is a system configured to carry out a defined task across multiple steps using instructions, context, and available capabilities.","build":"Use three cards with a single example icon for each term."},{"n":"12","section":"Understanding AI","title":"Knowledge Check","onscreen":"A workplace tool creates a new draft email from your instructions.\n\nWhat type of AI is involved?\n\nA  Rule-based automation\nB  Generative AI\nC  Spreadsheet formula\nD  Search filter","vo":"Select the option that best describes a tool creating a new draft email from your instructions.","build":"Use four selectable answer cards. On selection, show the separate feedback layer.\nSelect one answer.\nANSWER KEY: B"},{"n":"13","section":"Understanding AI","title":"Layer — Knowledge Check","onscreen":"CORRECT\nGenerative AI creates new content from instructions and context.\n\nINCORRECT\nThe key clue is that the system is creating new content from your instructions.","vo":"Correct feedback: Generative AI creates new content from instructions and context.\nIncorrect feedback: The key clue is that the system is creating new content from your instructions.","build":"Feedback layer for the previous slide. Add a Try Again or Continue trigger in Storyline.\nFeedback layer."},{"n":"14","section":"Capabilities and Limits","title":"What AI Can and Cannot Do","onscreen":"AI can support many kinds of work.\nBut capability does not equal reliability.","vo":"Now that you know what AI is, let us look at a critical distinction: what AI can do is not the same as what AI can reliably do.","build":""},{"n":"15","section":"Capabilities and Limits","title":"AI can generate and transform","onscreen":"GENERATE\nCreate a first draft or new content\n\nTRANSFORM\nRewrite, reformat, translate, or adapt existing content","vo":"AI can generate new content and transform existing content. For example, it can create a first draft or adapt information into a different format.","build":"Use a before and after visual with two large capability cards."},{"n":"16","section":"Capabilities and Limits","title":"AI can summarize and organize","onscreen":"SUMMARIZE\nCondense information into key points\n\nORGANIZE\nGroup, structure, or extract information","vo":"AI can also summarize information and help organize it. These capabilities can save time, but the resulting output still needs to be reviewed when accuracy matters.","build":"Show a long document becoming a concise summary and then a structured list."},{"n":"17","section":"Capabilities and Limits","title":"AI can identify patterns","onscreen":"IDENTIFY PATTERNS\nSpot themes, similarities, differences, or recurring information","vo":"AI can identify patterns in information. This can be useful for exploring large amounts of content, but pattern recognition does not automatically mean that the interpretation is correct or appropriate.","build":"Use a simple visual of repeated items becoming grouped themes."},{"n":"18","section":"Capabilities and Limits","title":"AI cannot guarantee the answer","onscreen":"AI cannot guarantee:\n• Accuracy\n• Completeness\n• Current information\n• Fairness\n• Appropriate judgment","vo":"AI can produce useful output, but it cannot guarantee accuracy, completeness, current information, fairness, or appropriate judgment. Those are areas where human review remains important.","build":"Reveal each limitation one at a time. Keep the list short and prominent."},{"n":"19","section":"Capabilities and Limits","title":"Confident does not mean correct","onscreen":"CONFIDENT OUTPUT  ≠  CORRECT OUTPUT","vo":"One of the most important habits in working with AI is to separate confidence from correctness. An AI response can sound polished and certain while still containing an error.","build":"Make the not-equal symbol the visual focus. Reuse this as a recurring micro-message on slides 30 and 74.\nAWARE cue: W (Weigh the Output)."},{"n":"20","section":"Capabilities and Limits","title":"Knowledge Check","onscreen":"An AI tool gives you a confident answer containing a fact you cannot confirm.\n\nWhat should you do?\n\nA  Assume confidence means accuracy\nB  Use it immediately\nC  Verify the information using an appropriate reliable source\nD  Ask AI to sound more certain","vo":"Select the response that best addresses an AI-generated answer that you cannot confirm.","build":"Four selectable answer cards. Show the feedback layer after selection.\nSelect one answer.\nANSWER KEY: C"},{"n":"21","section":"Capabilities and Limits","title":"Layer — Knowledge Check","onscreen":"CORRECT\nAI can produce convincing but inaccurate information. Important facts should be verified.\n\nINCORRECT\nAI can sound confident even when it is wrong. Important information should be checked before use.","vo":"Correct feedback: AI can produce convincing but inaccurate information. Important facts should be verified.\nIncorrect feedback: AI can sound confident even when it is wrong. Important information should be checked before use.","build":"Feedback layer for the previous slide.\nFeedback layer."},{"n":"22","section":"AI at Work","title":"AI at Work","onscreen":"Think  •  Create  •  Understand  •  Explore\n\nAI supports the work. People own the work.","vo":"AI can support work in many ways. At Level 1, the goal is not to teach specific workflows. It is to understand the role AI can play and the role people must continue to play.","build":""},{"n":"23","section":"AI at Work","title":"AI can help you think and create","onscreen":"THINK\nBrainstorm ideas and options\n\nCREATE\nDraft or generate content","vo":"AI can support thinking by helping you brainstorm ideas and options. It can also support creation by producing a starting draft or alternative versions.","build":"Use two large cards with light motion from idea to draft."},{"n":"24","section":"AI at Work","title":"AI can help you understand and explore","onscreen":"UNDERSTAND\nSummarize, explain, or clarify information\n\nEXPLORE\nLook across information for themes, patterns, or questions","vo":"AI can help you understand information by summarizing, explaining, or clarifying it. It can also help you explore themes, patterns, or questions in information.","build":"Use document and magnifying-glass style editable shapes."},{"n":"25","section":"AI at Work","title":"AI is an assistant, not the owner","onscreen":"AI can suggest, generate, organize, and assist.\n\nThe person still provides context, judgment, verification, and decisions.","vo":"The safest way to think about AI at work is as an assistant, not the owner of the work. AI can suggest, generate, organize, and assist. People provide the context, judgment, verification, and decisions. This matters most when work affects people, business decisions, or important outcomes, so people remain responsible for evaluating the output and making the decision.","build":"Use a simple two-column visual: AI assists on the left, human owns the work on the right. Then animate the handoff from AI output to human review and decision."},{"n":"27","section":"AI at Work","title":"Knowledge Check","onscreen":"Which example best reflects AI as an assistant?\n\nA  AI decides who should be promoted\nB  AI determines a candidate's suitability without human review\nC  AI approves a disciplinary action\nD  AI generates learning campaign ideas for a person to evaluate","vo":"Select the example that best reflects AI as an assistant.","build":"Four selectable answer cards. Show the feedback layer after selection.\nSelect one answer.\nANSWER KEY: D"},{"n":"28","section":"AI at Work","title":"Layer — Knowledge Check","onscreen":"CORRECT\nAI can support ideation while the person remains responsible for evaluation and decisions.\n\nINCORRECT\nAI can assist with ideas and information, but sensitive decisions require human judgment and accountability.","vo":"Correct feedback: AI can support ideation while the person remains responsible for evaluation and decisions.\nIncorrect feedback: AI can assist with ideas and information, but sensitive decisions require human judgment and accountability.","build":"Feedback layer for the previous slide.\nFeedback layer."},{"n":"29","section":"Responsible AI","title":"Responsible AI","onscreen":"Pause before you trust the output.\n\nCheck accuracy. Consider fairness. Respect intellectual property. Review use. Keep human accountability.","vo":"Responsible AI is about how we use AI, not just what AI can produce. We will focus on accuracy, fairness, intellectual property, appropriate use, and accountability.","build":""},{"n":"30","section":"Responsible AI","title":"Accuracy: pause, check, verify","onscreen":"PAUSE\nDo not accept the output automatically\n\nCHECK\nIdentify claims that matter\n\nVERIFY\nUse an appropriate reliable source\n\nAn output can be fluent and polished and still be wrong. If the consequence matters, verify.","vo":"When accuracy matters, pause before using the output. Check the claims that matter and verify them using an appropriate reliable source. AI systems can produce inaccurate or unsupported information, sometimes called hallucinations. Do not judge accuracy by how polished the answer sounds.","build":"Build the three steps as a simple horizontal process. Show a polished answer card with a subtle warning marker. Avoid scary imagery.\nAWARE cue: W (Weigh the Output)."},{"n":"30a","section":"Responsible AI","title":"Practice: spot the claims to verify","onscreen":"An AI draft says (fictional example):\n\nOur travel policy was updated in March 2022. It allows up to $75 per day for meals, as stated in Section 4.2 of the handbook.\n\nSelect every claim you would verify.","vo":"Here is a short AI-generated answer. It sounds polished, but not every detail can be trusted. Select the claims you would verify before using it.","build":"Hotspot interaction with three clickable claims (date, dollar amount, section reference). Learner selects all that apply, then submits. Use fictional content only. Feedback layer. CORRECT: Specific dates, amounts, and references are exactly the details AI can get wrong, so all three should be checked against the official source. INCORRECT: Look again. Any specific date, number, or reference needs checking, however polished the answer sounds. Allow one retry.\nAWARE cue: W (Weigh the Output)."},{"n":"32","section":"Responsible AI","title":"Bias and fairness","onscreen":"ASK\nCould this output disadvantage someone?\n\nREVIEW\nPay closer attention when people may be affected.","vo":"AI can reflect patterns or biases present in the information used to develop or operate a system. When people may be affected, review the output for fairness and apply human judgment.","build":"Use a balance visual with a question prompt. Keep the wording neutral and practical.\nAWARE cue: A (Assess the Risk)."},{"n":"33","section":"Responsible AI","title":"Copyright and intellectual property","onscreen":"Before you use or share AI-generated content:\n\nCHECK  Does it copy or closely resemble protected material?\nREVIEW  Who owns it, and what permissions apply?\nCONFIRM  Does your organization allow this use?","vo":"AI-generated or transformed content is not automatically free to use. Consider ownership, permissions, copyright, intellectual property requirements, and your organization's expectations before using or sharing content. AI output can resemble existing protected material, and ownership of AI-generated content can vary by location, so follow your organization's guidance.","build":"Use three editable check cards. Avoid legal claims beyond the source material."},{"n":"34","section":"Responsible AI","title":"When AI should not be the decision-maker","onscreen":"Do not delegate sensitive decisions or accountability to AI.\n\nEspecially when decisions affect people or carry significant consequences.\n\nAI can assist. Humans remain accountable.","vo":"There are situations where AI should support the process rather than make the decision. Do not delegate sensitive decisions or accountability to AI, especially when people may be affected or consequences are significant. In many places, decisions about employees and candidates are also covered by laws and policies that require human oversight. This is the core principle of the course: AI can assist, but humans remain accountable for how outputs are reviewed, used, and acted upon. Where your organization expects it, be open about when AI was used.","build":"Use a decision gate visual. Close with AI can assist. Humans remain accountable. as a strong visual statement, and reuse the phrase at the end of the course.\nAWARE cue: E (Ensure Human Accountability)."},{"n":"36","section":"Responsible AI","title":"Knowledge Check","onscreen":"AI generates a recommendation that could affect an employee.\n\nWhat is the most responsible next step?\n\nA  Review the recommendation, verify the information, consider fairness, and apply human judgment\nB  Use it because AI is objective\nC  Share it immediately\nD  Let AI make the final decision","vo":"Select the most responsible next step.","build":"Four selectable answer cards. Show the feedback layer after selection.\nSelect one answer.\nANSWER KEY: A"},{"n":"37","section":"Responsible AI","title":"Layer — Knowledge Check","onscreen":"CORRECT\nHuman review, verification, fairness, and accountability are essential when people may be affected.\n\nINCORRECT\nAI should not be treated as the final decision-maker in situations that affect people.","vo":"Correct feedback: Human review, verification, fairness, and accountability are essential when people may be affected.\nIncorrect feedback: AI should not be treated as the final decision-maker in situations that affect people.","build":"Feedback layer for the previous slide.\nFeedback layer."},{"n":"38","section":"Data, Privacy and Security","title":"Data, Privacy and Security","onscreen":"Before you share information with an AI tool, stop and assess the information, the tool, and your permission to use it.","vo":"Responsible AI also means protecting information. Depending on the tool and its settings, information you enter may be stored, reviewed, or used to improve the tool. Before you enter information into an AI tool, consider what the information is, who owns it, whether the tool is approved, and whether you are permitted to use it.","build":""},{"n":"39","section":"Data, Privacy and Security","title":"Think before you share","onscreen":"1  What information is it?\n2  Who owns it?\n3  Is the tool approved?\n4  Am I permitted to use it?","vo":"Use four questions before sharing information with an AI tool. What information is it? Who owns it? Is the tool approved? And am I permitted to use it?","build":"Reveal the four questions in sequence. Make them usable as a mental checklist.\nAWARE cue: A (Assess the Risk)."},{"n":"40","section":"Data, Privacy and Security","title":"Information to protect","onscreen":"CONFIDENTIAL\nSENSITIVE\nEMPLOYEE\nCANDIDATE\nPERSONAL\nCLIENT\nPROPRIETARY\nCREDENTIALS","vo":"Protect confidential, sensitive, employee, candidate, personal, client, and proprietary information, as well as login credentials. The ability of a tool to process information does not mean you are permitted to share that information with it.","build":"Use eight simple category cards. Keep this slide about recognition, not policy detail."},{"n":"41","section":"Data, Privacy and Security","title":"Use approved tools","onscreen":"APPROVED TOOL\n+\nPERMISSION\n+\nPOLICY REQUIREMENTS","vo":"Use approved AI tools and follow organizational policies and permissions. Unapproved tools may not meet your organization's security requirements. If you are unsure whether information may be used with a tool, stop and check the applicable requirement before proceeding.","build":"Use a three-part gate visual. Do not name internal tools unless the organization has approved them for the audience."},{"n":"42","section":"Data, Privacy and Security","title":"Protect the information throughout the process","onscreen":"Before input  →  During use  →  Before sharing output\n\nProtect information at every stage.","vo":"Information protection does not stop when you enter the prompt. Consider the information before input, during use, and again before sharing the output. During use, stay within approved tools and share only what the task needs.","build":"Use a three-stage process with a lock icon motif."},{"n":"42a","section":"Data, Privacy and Security","title":"If something goes wrong","onscreen":"STOP  Stop using that conversation\nREPORT  Tell [approved contact] right away\nLEARN  Reporting early helps limit harm","vo":"Mistakes can happen. If you realize you shared information you should not have, stop using that conversation and report it right away to [insert the contact named in your policy]. Reporting early helps the organization limit harm, and it is always better than hoping no one notices.","build":"Use a three-step process with the lock icon motif from slide 42. Insert the approved contact and process from organizational policy. Do not guess at policy details.\nAWARE cue: A (Assess the Risk)."},{"n":"43","section":"Data, Privacy and Security","title":"Knowledge Check","onscreen":"You want to paste an employee name, performance information, and personal details into an AI tool.\n\nWhat should you consider first?\n\nA  Whether the prompt is short\nB  Whether the information may be shared, whether the tool is approved, and what policy requirements apply\nC  Whether AI can summarize it\nD  Whether the output will look professional","vo":"Select the best answer.","build":"Four selectable answer cards. Show the feedback layer after selection.\nSelect one answer.\nANSWER KEY: B"},{"n":"44","section":"Data, Privacy and Security","title":"Layer — Knowledge Check","onscreen":"CORRECT\nCheck permissions, sensitivity, approved tools, and organizational requirements before sharing information.\n\nINCORRECT\nThe ability to process information does not mean you are permitted to share it. Privacy, security, and policy requirements come first.","vo":"Correct feedback: Check permissions, sensitivity, approved tools, and organizational requirements before sharing information.\nIncorrect feedback: The ability to process information does not mean you are permitted to share it. Privacy, security, and policy requirements come first.","build":"Feedback layer for the previous slide.\nFeedback layer."},{"n":"45","section":"Prompting","title":"Prompting Fundamentals","onscreen":"A useful prompt gives AI enough information to interpret what you need.","vo":"Once you know how AI works at a high level and how to use it responsibly, the next step is giving clear instructions. Prompting is simply communicating what you need from the system.","build":""},{"n":"46","section":"Prompting","title":"Start with context","onscreen":"CONTEXT\nWhat does AI need to know to interpret the situation?","vo":"Context gives AI the information it needs to interpret the situation. Think about the background, source information, or relevant details that shape the task.","build":"Reveal the single prompt element, then move to the next. Keep the visual pattern consistent."},{"n":"47","section":"Prompting","title":"Define the task","onscreen":"TASK\nWhat exactly do you want AI to do?","vo":"State the task clearly. Tell AI what you want it to produce, change, summarize, compare, or organize.","build":"Reveal the single prompt element, then move to the next. Keep the visual pattern consistent."},{"n":"48","section":"Prompting","title":"Specify the audience","onscreen":"AUDIENCE\nWho is the output for?","vo":"Tell AI who will use or read the output. Audience can influence language, detail, tone, and emphasis.","build":"Reveal the single prompt element, then move to the next. Keep the visual pattern consistent."},{"n":"49","section":"Prompting","title":"Describe the output","onscreen":"OUTPUT\nWhat should the result look like?","vo":"Describe the result you want. You can specify format, structure, or other output expectations.","build":"Reveal the single prompt element, then move to the next. Keep the visual pattern consistent."},{"n":"50","section":"Prompting","title":"Add constraints","onscreen":"CONSTRAINTS\nWhat boundaries should AI follow?","vo":"Add useful boundaries such as length, deadline, tone, required elements, or information that must be included or excluded.","build":"Reveal the single prompt element, then move to the next. Keep the visual pattern consistent."},{"n":"51","section":"Prompting","title":"Put the pieces together","onscreen":"CONTEXT + TASK + AUDIENCE + OUTPUT + CONSTRAINTS\n\nA clearer instruction gives AI a clearer target. Review the result, then refine.","vo":"The five fundamentals work together. Context, task, audience, output, and constraints give AI a clearer target. You do not need advanced prompting techniques for this level. After you get a response, review it and refine your prompt if needed.","build":"Animate each element into one prompt structure.\nAWARE cue: R (Respond with the Right Prompt)."},{"n":"52","section":"Prompting","title":"From vague to clear","onscreen":"VAGUE\nWrite an email.\n\nCLEARER\nOur annual compliance training takes 20 minutes and is in the learning portal. Draft a 100-word professional reminder to employees to complete it by Friday.","vo":"Compare these two prompts. The stronger version tells AI the background, what to create, who it is for, how long it should be, the tone, and the deadline. The goal is not to make the prompt complicated. The goal is to make the request clear.","build":"Use a side-by-side comparison. Highlight the added information rather than adding more examples."},{"n":"52a","section":"Prompting","title":"Practice: build the prompt","onscreen":"Start with:  Summarize this document.\n\nDrag the missing pieces into the prompt:\nCONTEXT   AUDIENCE   OUTPUT   CONSTRAINTS","vo":"Now it is your turn. This prompt is vague. Drag the missing pieces into place to make the request clearer, then compare your result with the stronger version.","build":"Drag-and-drop with four labeled slots in a prompt template and a bank of fictional options for each element (one correct, one distractor each). Feedback layer after submit. CORRECT: Each piece gives AI a clearer target. INCORRECT: Check what each piece supplies: the background, who it is for, what it should look like, and the limits. Allow one retry.\nAWARE cue: R (Respond with the Right Prompt)."},{"n":"53","section":"Prompting","title":"Knowledge Check","onscreen":"Which prompt is more likely to produce a useful result?\n\nA  Write an email.\nB  Write something professional.\nC  Our annual compliance training takes 20 minutes and is in the learning portal. Draft a 100-word professional reminder to employees to complete it by Friday.\nD  Email training.","vo":"Select the prompt most likely to produce a useful result.","build":"Four selectable answer cards. Show the feedback layer after selection.\nSelect one answer.\nANSWER KEY: C"},{"n":"54","section":"Prompting","title":"Layer — Knowledge Check","onscreen":"CORRECT\nThe prompt gives context, a clear task, audience, output expectation, tone, and deadline.\n\nINCORRECT\nA stronger prompt gives AI enough context and constraints to interpret the desired result.","vo":"Correct feedback: The prompt gives context, a clear task, audience, output expectation, tone, and deadline.\nIncorrect feedback: A stronger prompt gives AI enough context and constraints to interpret the desired result.","build":"Feedback layer for the previous slide.\nFeedback layer."},{"n":"55","section":"AI Agents","title":"AI Agents and Atlas Experience","onscreen":"From a single response to a defined task","vo":"You now have the foundation to understand what an AI agent is. In this section, you will see the difference between a chatbot and an agent and then experience a simple agent scenario in Atlas.","build":""},{"n":"56","section":"AI Agents","title":"What is an AI agent?","onscreen":"An AI agent is an AI system configured to carry out a defined task across multiple steps using:\n\nINSTRUCTIONS  +  CONTEXT  +  AVAILABLE CAPABILITIES","vo":"At a high level, an AI agent is an AI system configured to carry out a defined task across multiple steps using instructions, context, and available capabilities. An agent can work through a defined task or sequence rather than simply returning one response. It can use tools to take actions, which is why its work still needs review.","build":"Use a three-input model flowing into a defined task. Keep this conceptual."},{"n":"57","section":"AI Agents","title":"Chatbot versus AI agent","onscreen":"CHATBOT\nYou ask → AI responds\n\nAGENT\nYou define a task → Agent works through it","vo":"A chatbot typically responds to the request you make. An agent can be configured around a defined task and work through that task using its instructions, context, and capabilities. The difference is not the interface. An agent is set up to work through several steps toward a goal, often using tools, while a chatbot usually answers one request at a time.","build":"Use two lanes. Animate the chatbot response as one step and the agent task as a short sequence."},{"n":"58","section":"AI Agents","title":"Atlas: see the concept in action","onscreen":"DEFINE  →  CONFIGURE  →  TEST  →  REVIEW\n\nUse the approved Atlas environment for the demonstration.","vo":"Now we will connect the concept to a simple experience in Atlas. The focus is not on mastering a tool. Watch how the task is defined, how instructions and context shape the agent, how the result is tested, and how the output is reviewed.","build":"Insert an approved Atlas screen recording or screenshots. Do not invent UI labels. Add callouts to the actual interface during build."},{"n":"59","section":"AI Agents","title":"Atlas demonstration storyboard","onscreen":"STEP 1  Define the task\nSTEP 2  Add instructions and context\nSTEP 3  Test with a sample situation\nSTEP 4  Review the output","vo":"For the demonstration, define one simple task, add the instructions and context the agent needs, test it with a sample situation, and then review the output. The review step is essential: an agent can complete a task without making the result automatically correct or appropriate.","build":"Use this slide as the setup for a short screen recording. The exact Atlas clicks should be captured from the approved environment.\nScreen recording setup."},{"n":"60","section":"AI Agents","title":"Try a simple agent scenario","onscreen":"SCENARIO\nMeeting action tracker\n\nINPUT\nFictional sample meeting notes (no real names or data)\n\nTASK\nIdentify action, owner, and due date, then draft a reminder for each owner\n\nOUTPUT\nAction-item table and draft reminders for human review","vo":"For the learner experience, use a simple meeting action tracker. Give the agent fictional sample meeting notes and ask it to identify the action, owner, and due date and return the information as a clear action-item table and a draft reminder for each owner. Then review the result.","build":"If the Atlas environment supports learner creation, let learners build the simple agent. If not, use a guided demonstration.\nHands-on or guided practice."},{"n":"61","section":"AI Agents","title":"Knowledge Check","onscreen":"Which statement best describes an AI agent?\n\nA  A system configured to carry out defined tasks using instructions, context, and available capabilities\nB  A system that only searches the internet\nC  Any chatbot\nD  A spreadsheet macro","vo":"Select the statement that best describes an AI agent.","build":"Four selectable answer cards. Show the feedback layer after selection.\nSelect one answer.\nANSWER KEY: A"},{"n":"62","section":"AI Agents","title":"Layer — Knowledge Check","onscreen":"CORRECT\nAn AI agent can be configured to carry out a defined task or sequence using available capabilities.\n\nINCORRECT\nAn agent is more than a chatbot response. It is configured to perform a defined task using instructions, context, and capabilities.","vo":"Correct feedback: An AI agent can be configured to carry out a defined task or sequence using available capabilities.\nIncorrect feedback: An agent is more than a chatbot response. It is configured to perform a defined task using instructions, context, and capabilities.","build":"Feedback layer for the previous slide.\nFeedback layer."},{"n":"63","section":"Assessment","title":"Comprehensive Assessment","onscreen":"Show what you know.\n\nThe assessment tests understanding and judgment, not simple recall.","vo":"You have reached the comprehensive assessment. The questions bring together the ideas from the course and ask you to apply judgment to realistic situations.","build":"Use a clean transition into the assessment. Eight scenario-based questions follow."},{"n":"64","section":"Assessment","title":"1 of 8 — AI Fundamentals","onscreen":"A teammate says the language model looked up the verified answer. Which statement is most accurate?\n\nA  It retrieved a verified fact from a trusted database\nB  It understands the topic the way a human expert does\nC  It guarantees the information is current\nD  It generated a response from learned patterns, so the response still needs to be checked","vo":"Read the scenario and select the response that best reflects the principles from this course.","build":"Use a four-option interaction. Provide immediate feedback on the separate layer slide.\nSelect one answer.\nANSWER KEY: D"},{"n":"65","section":"Assessment","title":"Layer — Assessment 1 of 8","onscreen":"CORRECT\nCorrect. A language model generates language from patterns learned from data. It does not check facts on its own, so important output still needs review.\n\nINCORRECT\nNot quite. A language model generates language from learned patterns. It does not retrieve verified facts or understand a topic like an expert, so its output must be checked.","vo":"Correct feedback: Correct. A language model generates language from patterns learned from data. It does not check facts on its own, so important output still needs review.\nIncorrect feedback: Not quite. A language model generates language from learned patterns. It does not retrieve verified facts or understand a topic like an expert, so its output must be checked.","build":"Feedback layer. In Storyline, link the Continue trigger to the next assessment question.\nFeedback layer.\nRecord the correct and incorrect audio as two separate clips and do not read the labels aloud. Feedback on layers 65 to 79 is now specific to each question."},{"n":"66","section":"Assessment","title":"2 of 8 — AI Limitations","onscreen":"An AI-generated summary includes a statement that may be outdated. What is the appropriate response?\n\nA  Verify the statement before relying on it\nB  Publish it immediately\nC  Assume the AI checked it\nD  Remove all human review","vo":"Read the scenario and select the response that best reflects the principles from this course.","build":"Use a four-option interaction. Provide immediate feedback on the separate layer slide.\nSelect one answer.\nANSWER KEY: A"},{"n":"67","section":"Assessment","title":"Layer — Assessment 2 of 8","onscreen":"CORRECT\nCorrect. AI output can be outdated or inaccurate, so statements that matter should be verified before use.\n\nINCORRECT\nNot quite. AI cannot guarantee current or accurate information. Verify the statement before relying on it.","vo":"Correct feedback: Correct. AI output can be outdated or inaccurate, so statements that matter should be verified before use.\nIncorrect feedback: Not quite. AI cannot guarantee current or accurate information. Verify the statement before relying on it.","build":"Feedback layer. In Storyline, link the Continue trigger to the next assessment question.\nFeedback layer."},{"n":"68","section":"Assessment","title":"3 of 8 — Human Accountability","onscreen":"An AI system suggests an action that could affect an employee. What should happen?\n\nA  AI makes the final decision\nB  The employee should not be informed\nC  The recommendation is automatically approved\nD  A person reviews the information, context, fairness, and implications before deciding","vo":"Read the scenario and select the response that best reflects the principles from this course.","build":"Use a four-option interaction. Provide immediate feedback on the separate layer slide.\nSelect one answer.\nANSWER KEY: D"},{"n":"69","section":"Assessment","title":"Layer — Assessment 3 of 8","onscreen":"CORRECT\nCorrect. When an AI suggestion affects a person, a human reviews the information, context, and fairness before deciding.\n\nINCORRECT\nNot quite. AI should not be the final decision-maker when people are affected. Human review and accountability are required.","vo":"Correct feedback: Correct. When an AI suggestion affects a person, a human reviews the information, context, and fairness before deciding.\nIncorrect feedback: Not quite. AI should not be the final decision-maker when people are affected. Human review and accountability are required.","build":"Feedback layer. In Storyline, link the Continue trigger to the next assessment question.\nFeedback layer."},{"n":"70","section":"Assessment","title":"4 of 8 — Data and Privacy","onscreen":"You need to use AI with candidate information. What should you check first?\n\nA  Only whether the AI produces a good answer\nB  Whether the prompt is short\nC  Whether the information may be shared, whether the tool is approved, and what policies apply\nD  Whether the output is visually appealing","vo":"Read the scenario and select the response that best reflects the principles from this course.","build":"Use a four-option interaction. Provide immediate feedback on the separate layer slide.\nSelect one answer.\nANSWER KEY: C"},{"n":"71","section":"Assessment","title":"Layer — Assessment 4 of 8","onscreen":"CORRECT\nCorrect. Before using candidate information with AI, confirm you may share it, the tool is approved, and policy requirements are met.\n\nINCORRECT\nNot quite. The ability to process information does not mean you are permitted to share it. Check permission, tool approval, and policy first.","vo":"Correct feedback: Correct. Before using candidate information with AI, confirm you may share it, the tool is approved, and policy requirements are met.\nIncorrect feedback: Not quite. The ability to process information does not mean you are permitted to share it. Check permission, tool approval, and policy first.","build":"Feedback layer. In Storyline, link the Continue trigger to the next assessment question.\nFeedback layer."},{"n":"72","section":"Assessment","title":"5 of 8 — Prompting","onscreen":"You need AI to summarize a report for your leadership team. Which prompt is strongest?\n\nA  Summarize this.\nB  Make it better.\nC  Create a concise professional 100-word summary for a leadership audience, highlighting three key actions.\nD  Write something useful.","vo":"Read the scenario and select the response that best reflects the principles from this course.","build":"Use a four-option interaction. Provide immediate feedback on the separate layer slide.\nSelect one answer.\nANSWER KEY: C"},{"n":"73","section":"Assessment","title":"Layer — Assessment 5 of 8","onscreen":"CORRECT\nCorrect. The prompt states the task, audience, length, and focus, which gives AI a clear target.\n\nINCORRECT\nNot quite. A stronger prompt states the task, audience, output, and constraints instead of leaving AI to guess.","vo":"Correct feedback: Correct. The prompt states the task, audience, length, and focus, which gives AI a clear target.\nIncorrect feedback: Not quite. A stronger prompt states the task, audience, output, and constraints instead of leaving AI to guess.","build":"Feedback layer. In Storyline, link the Continue trigger to the next assessment question.\nFeedback layer."},{"n":"74","section":"Assessment","title":"6 of 8 — Responsible Use","onscreen":"An AI response is polished and persuasive but contains a claim you cannot verify. What should you do?\n\nA  Use it because it sounds professional\nB  Verify the claim before using it\nC  Ask AI to make it more persuasive\nD  Remove the source and keep the claim","vo":"Read the scenario and select the response that best reflects the principles from this course.","build":"Use a four-option interaction. Provide immediate feedback on the separate layer slide.\nSelect one answer.\nANSWER KEY: B"},{"n":"75","section":"Assessment","title":"Layer — Assessment 6 of 8","onscreen":"CORRECT\nCorrect. A polished answer is not necessarily accurate. Verify claims you cannot confirm before using them.\n\nINCORRECT\nNot quite. Confidence and polish do not mean correctness. Verify the claim before using it.","vo":"Correct feedback: Correct. A polished answer is not necessarily accurate. Verify claims you cannot confirm before using them.\nIncorrect feedback: Not quite. Confidence and polish do not mean correctness. Verify the claim before using it.","build":"Feedback layer. In Storyline, link the Continue trigger to the next assessment question.\nFeedback layer."},{"n":"76","section":"Assessment","title":"7 of 8 — AI at Work","onscreen":"You are preparing for a team meeting. Which use of AI keeps it in an assisting role?\n\nA  AI drafts agenda options and you choose and adjust the final agenda\nB  AI decides which team member's idea is adopted\nC  AI sends the agenda to the team without your review\nD  AI assigns each person to a project without discussion","vo":"Read the scenario and select the response that best reflects the principles from this course.","build":"Use a four-option interaction. Provide immediate feedback on the separate layer slide.\nSelect one answer.\nANSWER KEY: A"},{"n":"77","section":"Assessment","title":"Layer — Assessment 7 of 8","onscreen":"CORRECT\nCorrect. AI can draft options while the person evaluates, adjusts, and decides.\n\nINCORRECT\nNot quite. AI can assist with options, but people make and own the decisions.","vo":"Correct feedback: Correct. AI can draft options while the person evaluates, adjusts, and decides.\nIncorrect feedback: Not quite. AI can assist with options, but people make and own the decisions.","build":"Feedback layer. In Storyline, link the Continue trigger to the next assessment question.\nFeedback layer."},{"n":"78","section":"Assessment","title":"8 of 8 — AI Agents","onscreen":"A team sets up an AI agent that turns meeting notes into action items and drafts reminders. What should happen before the reminders are sent?\n\nA  Nothing, because completing the task means the output is correct\nB  The agent should be given more sensitive data so it is more accurate\nC  The reminders should be sent immediately to save time\nD  A person should review the output for accuracy, appropriateness, and sensitive information","vo":"Read the scenario and select the response that best reflects the principles from this course.","build":"Use a four-option interaction. Provide immediate feedback on the separate layer slide.\nSelect one answer.\nANSWER KEY: D"},{"n":"79","section":"Assessment","title":"Layer — Assessment 8 of 8","onscreen":"CORRECT\nCorrect. An agent can complete a task without the result being correct or appropriate, so a person reviews the output first.\n\nINCORRECT\nNot quite. Completing a task does not make an agent's output correct. Review it for accuracy, appropriateness, and sensitive information before it is used.","vo":"Correct feedback: Correct. An agent can complete a task without the result being correct or appropriate, so a person reviews the output first.\nIncorrect feedback: Not quite. Completing a task does not make an agent's output correct. Review it for accuracy, appropriateness, and sensitive information before it is used.","build":"Feedback layer. In Storyline, link the Continue trigger to the next assessment question.\nFeedback layer."},{"n":"79a","section":"Assessment","title":"Your results","onscreen":"Your score: [score]    Passing score: [X]%\n\nPASS  You have completed AI Literacy, Level 1.\nNOT YET  Review the sections that match the questions you missed.","vo":"You have completed the assessment. [Pass layer] Congratulations, you have met the Level 1 standard. [Not yet layer] You have not reached the passing score yet. Review the sections that match the questions you missed, then try again.","build":"Results slide with two layers (pass, not yet). Use a score variable and a passing score variable. Pass: record completion to the LMS and show a Continue button to slide 80. Not yet: show buttons that link back to each section (Understanding AI, Capabilities and Limits, AI at Work, Responsible AI, Data Privacy and Security, Prompting, AI Agents) and a Retry button. Confirm pass mark and attempts (see Additional design recommendations)."},{"n":"80","section":"Close","title":"Carry AWARE forward","onscreen":"A  Appreciate AI\nW  Weigh the Output\nA  Assess the Risk\nR  Respond with the Right Prompt\nE  Ensure Human Accountability\n\nAI can assist. Humans remain accountable.","vo":"You now have the Level 1 foundation. Use AWARE as you continue working with AI: appreciate what it can do, weigh the output, assess the risk, respond with the right prompt, and ensure human accountability.","build":"Animate AWARE as a final recap. End on the core principle."},{"n":"80a","section":"Close","title":"Your quick reference","onscreen":"DOWNLOAD  One-page Level 1 quick reference\n\nAWARE  The five-part mental model\nBEFORE YOU SHARE  The four questions\nPROMPT  The five elements","vo":"Before you go, download a one-page quick reference. It brings together AWARE, the four questions to ask before sharing information, and the five elements of a clear prompt, so you can use them at work.","build":"Attach a one-page job aid as a tagged, accessible PDF (AWARE; Before you share; Prompt checklist) with a Download button. Place after slide 80 and before slide 81."},{"n":"81","section":"Close","title":"What comes next","onscreen":"LEVEL 1  Understand\nBuild the foundation\n\nLEVEL 2  Use\nUse AI in everyday work\n\nLEVEL 3  Apply\nApply AI within your function\n\nLEVEL 4  Improve and Transform\nRedesign and scale AI-enabled work","vo":"Level 1 establishes the foundation. Later levels build on it with practical everyday use, function-specific applications, and AI-enabled improvement and transformation. The goal here is not to cover everything. It is to make sure everyone starts from a shared foundation.","build":"Show four connected levels. Highlight Level 1 as complete."}]; window.D = {"SECTIONS":[{"key":"understand","label":"Understand AI"},{"key":"limits","label":"Capabilities and limits"},{"key":"work","label":"AI at work"},{"key":"responsible","label":"Responsible AI"},{"key":"data","label":"Protect information"},{"key":"prompting","label":"Prompt with purpose"},{"key":"agents","label":"AI agents and Atlas"},{"key":"assessment","label":"Assessment"}],"CHARACTER":{"name":"Meera","role":"Talent Partner","note":"Fictional character. In Storyline, use one Content Library 360 illustrated character for every appearance."},"SCREENS":[{"n":[1],"layout":"title","section":null,"storyline":"Title slide on the template's COVER layout. Entrance animation: title Fade (0.75s), subtitle Fade 0.5s later. Disable Next until timeline ends."},{"n":[2],"layout":"outcomes","section":null,"intro":"By the end of this course, you will be able to:","items":["Use AI effectively and understand its limitations","Use AI responsibly and protect sensitive information","Use basic prompting techniques to guide AI outputs","Describe what an AI agent is and why its work still needs human review"],"storyline":"Four outcome rows. Add each row's Fade entrance at a cue point that matches the narration."},{"n":[3],"layout":"journey","section":null,"steps":["Understand AI","Understand its capabilities and limits","See where AI supports work","Use AI responsibly","Protect information","Prompt with purpose","Experience an AI agent","Demonstrate your judgment"],"storyline":"Horizontal path of 8 stops. Animate the path line with a Wipe (From Left), then each stop Fades in on a cue point. This same path becomes the progress bar at the top of every slide (it lives on the slide master)."},{"n":[4],"layout":"aware","section":null,"letters":[["A","Appreciate AI"],["W","Weigh the Output"],["A","Assess the Risk"],["R","Respond with the Right Prompt"],["E","Ensure Human Accountability"]],"storyline":"Five letter tiles. Each tile Fades + Grows in on the cue point where the narrator says that word. Later, the letter appears as a small badge (top right) only on the slides the storyboard names as AWARE cues."},{"n":[5],"layout":"opener","section":0,"sectionNo":1,"lines":["What is AI?","How does generative AI work at a high level?","What language will you hear when people talk about AI?"],"meera":{"situation":"Meera's manager says, \"Just ask the AI. It knows everything.\" Meera has used a chatbot twice and isn't sure what \"the AI\" actually is.","question":"What would you want to understand first?","options":[{"label":"What AI actually is, and what it does","reply":"A strong place to start. Knowing what a tool is helps you judge what to expect from it."},{"label":"Which buttons to press","reply":"Useful later. Tools change often, so this course starts with ideas that work across every AI tool."},{"label":"Nothing. If it knows everything, just use it","reply":"Hold that thought. By the end of this course you will see why \"knows everything\" is not quite true."}],"vo":"Meet Meera, a Talent Partner. Her manager has told her to just ask the AI, because it knows everything. What would you want to understand first? Choose an option."},"storyline":"Section opener on the template's dark CHAPTER TITLE layout (title in Pro Green). Base layer: section number, title, three questions (Fade in on cues). Then show layer \"Meera\" automatically when the base timeline ends. Meera layer: character + speech panel + 3 choice buttons. Each button shows its own reply layer and changes variable MeeraDone = True. Next is disabled until MeeraDone = True."},{"n":[6],"layout":"defineCards","section":0,"definition":"AI is technology that enables systems to perform tasks that typically require some form of human intelligence.","caps":["Recognize patterns","Interpret information","Generate content","Make predictions"],"storyline":"Central AI node with the definition dominant. Four capability cards Fade in around it on narration cues."},{"n":[7],"layout":"umbrella","section":0,"statement":"AI is not one single tool.","sub":"Different systems can be designed for different capabilities.","tiles":6,"storyline":"Six plain system tiles (no product names) Fade in under one \"AI\" umbrella shape, 0.2s apart (brand rule: no fly-ins)."},{"n":[8],"layout":"radial","section":0,"definition":"Generative AI creates new content from instructions and context.","types":["TEXT","IMAGES","AUDIO","VIDEO","CODE"],"storyline":"Definition stays on screen throughout. Five output chips Fade in around the centre, 0.25s apart (brand rule: no fly-ins)."},{"n":[9],"layout":"flow","section":0,"text":"A large language model (LLM) learns patterns from large amounts of data and uses those patterns to generate language.","nodes":["Data","Language model","Response"],"storyline":"Three-node flow: data patterns → language model → response. Animate the connecting arrows with Wipe. Do not add a \"checked\" or \"verified\" mark anywhere on the response."},{"n":[10],"layout":"reveal","section":0,"cards":[["PROMPT","The instruction you give AI"],["CONTEXT","Information that helps AI interpret the task"]],"instruction":"Select each card.","instructionAdded":true,"storyline":"Two large cards. Each card has states: Normal (term only) and Selected (term + definition). Trigger: when user clicks card, change state to Selected. Next is enabled when both cards are Selected."},{"n":[11],"layout":"reveal","section":0,"cards":[["HALLUCINATION","An inaccurate or unsupported AI output"],["BIAS","A pattern that can lead to unfair or distorted outcomes"],["AGENT","An AI system configured to carry out a defined task across multiple steps"]],"icons":["warn","balance","agent"],"instruction":"Select each card.","instructionAdded":true,"storyline":"Same card pattern as slide 10, one icon per term. Next is enabled when all three cards are Selected."},{"n":[12,13],"layout":"kc","section":0,"storyline":"Freeform Pick One question (Insert > Convert to Freeform > Pick One). Four answer cards with Normal / Hover / Selected states. Submit button. Correct and Incorrect layers from slide 13. Unscored: in Form View set Score to None. Attempts: 2 (one retry, as the review recommends). The Incorrect layer shows Try Again on attempt 1; on attempt 2 it shows the correct answer and Continue."},{"n":[14],"layout":"opener","section":1,"sectionNo":2,"lines":["AI can support many kinds of work.","But capability does not equal reliability."],"meera":{"situation":"Meera asks AI to summarize 40 pages of survey comments. The summary is polished, and it includes a statistic she has not seen before.","question":"What should Meera do with the summary?","options":[{"label":"Send it to leadership now","reply":"Risky. A polished summary can still contain an error. This section shows why."},{"label":"Check the statistic before using it","reply":"Good call. Being useful and being reliable are two different things."},{"label":"Ask the AI if it is sure","reply":"AI can sound certain and still be wrong. You will see why in this section."}],"vo":"Meera has an AI-generated summary of forty pages of survey comments. It looks polished, and it includes a statistic she has not seen before. What should she do?"},"storyline":"Same opener pattern as slide 5."},{"n":[15],"layout":"beforeAfter","section":1,"cards":[["GENERATE","Create a first draft or new content"],["TRANSFORM","Rewrite, reformat, translate, or adapt existing content"]],"storyline":"Before/after visual: a blank page becoming a draft (Generate), and a page becoming a reformatted page (Transform). Cards Fade in on cues."},{"n":[16],"layout":"condense","section":1,"cards":[["SUMMARIZE","Condense information into key points"],["ORGANIZE","Group, structure, or extract information"]],"storyline":"A long document shape shrinks into a short summary, then into a structured list."},{"n":[17],"layout":"pattern","section":1,"card":["IDENTIFY PATTERNS","Spot themes, similarities, differences, or recurring information"],"storyline":"Scattered dots move (motion paths) into three grouped clusters. One card beside them."},{"n":[18],"layout":"limits","section":1,"intro":"AI cannot guarantee:","items":["Accuracy","Completeness","Current information","Fairness","Appropriate judgment"],"storyline":"Large, short list. Each item Fades in on its narration cue."},{"n":[19],"layout":"notEqual","section":1,"left":"CONFIDENT OUTPUT","right":"CORRECT OUTPUT","storyline":"The ≠ symbol is the visual focus: it draws in last with a Grow entrance. Save the ≠ group as a reusable asset; it reappears as a small marker on slide 30 and in question 6."},{"n":[20,21],"layout":"kc","section":1,"storyline":"Same knowledge-check pattern as slide 12."},{"n":[22],"layout":"opener","section":2,"sectionNo":3,"lines":["Think  •  Create  •  Understand  •  Explore","AI supports the work. People own the work."],"meera":{"situation":"Meera needs ideas for a learning campaign by Friday. A colleague suggests letting AI choose the campaign.","question":"How should Meera use AI here?","options":[{"label":"Let AI choose the campaign","reply":"AI can suggest, but the choice is Meera's to own. This section explains the difference."},{"label":"Use AI to brainstorm, then choose herself","reply":"Exactly. AI supports the work. Meera owns it."},{"label":"Avoid AI completely","reply":"That is an option, but AI can save time on early ideas. This section shows where it helps."}],"vo":"Meera needs learning campaign ideas by Friday. A colleague suggests letting AI choose the campaign. How should she use AI here?"},"storyline":"Same opener pattern as slide 5."},{"n":[23],"layout":"pair","section":2,"cards":[["THINK","Brainstorm ideas and options"],["CREATE","Draft or generate content"]],"icons":["idea","draft"],"storyline":"Two large cards with light motion: an idea shape moves (motion path) from the THINK card into the CREATE card."},{"n":[24],"layout":"pair","section":2,"cards":[["UNDERSTAND","Summarize, explain, or clarify information"],["EXPLORE","Look across information for themes, patterns, or questions"]],"icons":["doc","search"],"storyline":"Document and magnifying-glass icons (editable shapes or the supplied SVGs)."},{"n":[25],"layout":"twoCol","section":2,"left":["AI","AI can suggest, generate, organize, and assist."],"right":["HUMAN","The person still provides context, judgment, verification, and decisions."],"storyline":"Merged with old slide 26. Two columns: AI side in Process blue (#4278BC) with a dashed outline; human side in Talent teal (#00B6BD) with a solid outline. Then an \"output\" card moves on a motion path from the AI column to the human column, where a \"Review and decide\" tick appears."},{"n":[27,28],"layout":"kc","section":2,"storyline":"Same knowledge-check pattern as slide 12."},{"n":[29],"layout":"opener","section":3,"sectionNo":4,"lines":["Pause before you trust the output.","Check accuracy. Consider fairness. Respect intellectual property. Review use. Keep human accountability."],"meera":{"situation":"An AI tool recommends which three employees should join a leadership programme. Meera's manager wants the list today.","question":"What is Meera's next step?","options":[{"label":"Forward the list as it is","reply":"This decision affects people, so it needs more than a forward. Let's look at why."},{"label":"Review the list for accuracy and fairness first","reply":"Right. When people are affected, review and accountability come first."},{"label":"Ask the AI for a longer list","reply":"A longer list still needs a person to review it and own the decision."}],"vo":"An AI tool has recommended three employees for a leadership programme, and Meera's manager wants the list today. What is her next step?"},"storyline":"Same opener pattern as slide 5."},{"n":[30],"layout":"steps","section":3,"steps":[["PAUSE","Do not accept the output automatically"],["CHECK","Identify claims that matter"],["VERIFY","Use an appropriate reliable source"]],"warning":"An output can be fluent and polished and still be wrong. If the consequence matters, verify.","storyline":"Merged with old slide 31. Three-step horizontal process (each step Fades in with its arrow on cue). Below it, a polished answer card (text drawn as grey bars, no readable fake facts) with the small ≠ warning marker that Pulses once. No alarming imagery."},{"n":["30a"],"layout":"hotspot","section":3,"intro":"An AI draft says (fictional example):","text":"Our travel policy was updated in March 2022. It allows up to ₹2,000 per day for meals, as stated in Section 4.2 of the handbook.","claims":["March 2022","₹2,000 per day","Section 4.2"],"override":"Currency changed from $75 to ₹2,000 for learners in India (course owner decision).","prompt":"Select every claim you would verify.","storyline":"New slide from the review. Put the sentence in one text box, then draw three transparent rectangles over the claims. Each rectangle has Normal and Selected states (Selected = teal underline + fill). Submit button: if all three are Selected, show layer Correct; otherwise show layer Incorrect. Number variable Attempts30a: on the second wrong attempt the Incorrect layer shows all three claims highlighted and a Continue button. Unscored."},{"n":[32],"layout":"balance","section":3,"cards":[["ASK","Could this output disadvantage someone?"],["REVIEW","Pay closer attention when people may be affected."]],"storyline":"Balance-scale icon above two cards. The scale tips gently (Spin emphasis, 5°) and settles."},{"n":[33],"layout":"checks3","section":3,"intro":"Before you use or share AI-generated content:","checks":[["CHECK","Does it copy or closely resemble protected material?"],["REVIEW","Who owns it, and what permissions apply?"],["CONFIRM","Does your organization allow this use?"]],"pending":"Legal review of the intellectual-property wording (on screen and voiceover).","storyline":"Three check cards, each with its question. Each gets a tick on its narration cue. Do not add legal claims (wording pending legal review)."},{"n":[34],"layout":"gate","section":3,"text":"Do not delegate sensitive decisions or accountability to AI.","sub":"Especially when decisions affect people or carry significant consequences.","closing":["AI can assist.","Humans remain accountable."],"pending":"Legal and HR review of the voiceover sentences on laws for employee decisions and on being open about AI use.","storyline":"Merged with old slide 35. Decision-gate visual: the AI path stops at a gate; only the human path continues. Then a full-width navy band slides up with \"AI can assist.\" (light blue) \"Humans remain accountable.\" (teal). Reuse this band on slide 80."},{"n":[36,37],"layout":"kc","section":3,"storyline":"Same knowledge-check pattern as slide 12."},{"n":[38],"layout":"opener","section":4,"sectionNo":5,"lines":["Before you share information with an AI tool, stop and assess the information, the tool, and your permission to use it."],"meera":{"situation":"Meera wants AI to help her draft feedback for a team member. The full performance review is open on her screen.","question":"What should Meera do before pasting anything?","options":[{"label":"Paste the whole review in","reply":"Being able to paste it doesn't mean she is allowed to. This section shows what to check."},{"label":"Check what she may share and whether the tool is approved","reply":"Yes. Information, tool and permission come before the prompt."},{"label":"Remove the name, then paste the rest","reply":"Better, but other details can still identify the person. She should check permission and the tool first."}],"vo":"Meera wants AI to help draft feedback for a team member, and the full performance review is open on her screen. What should she do before pasting anything?"},"storyline":"Same opener pattern as slide 5."},{"n":[39],"layout":"checklist","section":4,"items":["What information is it?","Who owns it?","Is the tool approved?","Am I permitted to use it?"],"instruction":"Select each question to tick it off.","instructionAdded":true,"storyline":"Four checklist rows, each a button with Normal and Selected (ticked) states. Next is enabled when all four are Selected. Make the list feel like a reusable mental checklist."},{"n":[40],"layout":"categories","section":4,"items":["CONFIDENTIAL","SENSITIVE","EMPLOYEE","CANDIDATE","PERSONAL","CLIENT","PROPRIETARY","CREDENTIALS"],"pending":"Privacy check: do Client, Proprietary and Credentials match the data-classification policy?","storyline":"Eight category cards in two rows of four, each with a small lock. Recognition only, no policy detail. Categories pending your data-classification check."},{"n":[41],"layout":"threeGate","section":4,"parts":["APPROVED TOOL","PERMISSION","POLICY REQUIREMENTS"],"storyline":"Three-part gate: three bars that each turn to the \"open\" state on cue. Do not name internal tools."},{"n":[42],"layout":"stages","section":4,"stages":["Before input","During use","Before sharing output"],"sub":"Protect information at every stage.","storyline":"Three-stage process with a lock icon on each stage. A lock travels along the path (motion path)."},{"n":["42a"],"layout":"recover","section":4,"steps":[["STOP","Stop using that conversation"],["REPORT","Tell [approved contact] "Apply","Apply AI within your function"],["LEVEL 4","Improve and Transform","Redesign and scale AI-enabled work"]],"storyline":"Four connected level cards. Level 1 shows a \"Complete\" tick. Add an Exit Course button (trigger: Exit course) if your LMS needs one."}],"FLAGS":[{"slides":[60],"who":"Team lead","text":"The notes on slide 60 are real meeting notes (approved for use by the course owner, names changed), so the INPUT tab now reads \"Sample meeting notes\" instead of the reviewed \"Fictional sample meeting notes (no real names or data)\".","fix":"Let the team lead know about this wording change."},{"slides":[10,11,15,16,23,24,30,32,33,40,41,46,47,48,49,50,51,52,56,57,58,60],"who":"Team lead","text":"The brand template says to avoid ALL CAPITALS, but the storyboard writes labels such as PROMPT, CONTEXT, CHECK and CONFIDENTIAL in capitals.","fix":"Approve sentence case (Prompt, Context, Check, Confidential). It is a styling change only, with no change to wording."},{"slides":[60],"who":"Team lead","text":"The slide 60 voiceover has been replaced with a learner-facing version built from the original script (the reviewed text was written to the course builder).","fix":"Team lead to confirm the new wording before audio is recorded."},{"slides":[55],"who":"Team lead","text":"Added the one-line Atlas description the review asked for.","fix":"Team lead to confirm the wording."},{"slides":["79a"],"who":"You","text":"With 2 attempts, learners who fail twice need a next step. The prototype shows a drafted message pointing them to the L&D team.","fix":"Confirm the message and who learners should contact."},{"slides":[66,68,70,74],"who":"Team lead","text":"The review itself notes that questions 2, 3, 4 and 6 still mirror earlier knowledge checks.","fix":"Optional: rewrite these four as new scenarios."},{"slides":[32,33],"who":"Team lead","text":"The review notes that bias/fairness and intellectual property have no assessment question.","fix":"Optional: add one question for each."}]};</script>
<script>

(function () {
  const SB = {}; window.SB.forEach(r => { SB[r.n] = r; });
  const { SECTIONS, CHARACTER, SCREENS, FLAGS } = window.D;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sb = n => SB[n] || { title: '', onscreen: '', vo: '', build: '' };

  // ---------- icons (same shapes ship in the asset pack) ----------
  const I = {
    warn: '<svg viewBox="0 0 48 48" fill="none" stroke="#497edc" stroke-width="3" stroke-linejoin="round"><path d="M24 6 44 41H4Z"/><path d="M24 19v11M24 35v1" stroke-linecap="round"/></svg>',
    balance: '<svg viewBox="0 0 48 48" fill="none" stroke="#497edc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6v36M12 42h24M8 14h32"/><path d="M8 14 3 28h10ZM40 14l-5 14h10Z"/></svg>',
    agent: '<svg viewBox="0 0 48 48" fill="none" stroke="#497edc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="14" width="32" height="24" rx="6"/><path d="M24 6v8M18 26h.01M30 26h.01M4 24v6M44 24v6"/></svg>',
    idea: '<svg viewBox="0 0 48 48" fill="none" stroke="#497edc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M17 30a12 12 0 1 1 14 0v6H17Z"/><path d="M19 42h10"/></svg>',
    draft: '<svg viewBox="0 0 48 48" fill="none" stroke="#497edc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h20l8 8v28H10Z"/><path d="M16 22h16M16 29h16M16 36h9"/></svg>',
    doc: '<svg viewBox="0 0 48 48" fill="none" stroke="#497edc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h20l8 8v28H10Z"/><path d="M30 6v8h8M16 24h16M16 31h12"/></svg>',
    search: '<svg viewBox="0 0 48 48" fill="none" stroke="#497edc" stroke-width="3" stroke-linecap="round"><circle cx="21" cy="21" r="12"/><path d="m30 30 12 12"/></svg>',
    lock: c => `<svg viewBox="0 0 48 48" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="21" width="30" height="21" rx="4"/><path d="M15 21v-6a9 9 0 0 1 18 0v6M24 30v4"/></svg>`,
    open: '<svg viewBox="0 0 48 48" fill="none" stroke="#4f7a1c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="21" width="30" height="21" rx="4"/><path d="M15 21v-6a9 9 0 0 1 17-4"/><path d="m18 31 4 4 8-8"/></svg>',
    play: '<svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7Z" fill="#021f62"/></svg>',
    sys: '<svg viewBox="0 0 48 48" fill="none" stroke="#497edc" stroke-width="3"><rect x="8" y="8" width="32" height="32" rx="8"/><circle cx="24" cy="24" r="6"/></svg>',
  };
  const MEERA = `<svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="Meera">
    <circle cx="80" cy="80" r="78" fill="#d9f5f6"/>
    <path d="M30 150c4-30 24-46 50-46s46 16 50 46Z" fill="#00bbc2"/>
    <path d="M66 100h28v14c-4 6-24 6-28 0Z" fill="#9c6b4a"/>
    <circle cx="80" cy="70" r="30" fill="#b07a55"/>
    <path d="M48 70c0-24 14-38 33-38s31 14 31 34c-10-2-22-10-28-20-6 12-20 22-36 24Z" fill="#1e1a22"/>
    <circle cx="104" cy="42" r="12" fill="#1e1a22"/>
    <circle cx="70" cy="74" r="2.6" fill="#1e1a22"/><circle cx="91" cy="74" r="2.6" fill="#1e1a22"/>
    <path d="M72 86c5 4 11 4 16 0" stroke="#5a3826" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="80.5" cy="60" r="2" fill="#fb4671"/>
  </svg>`;

  // ---------- parsing helpers for signed-off text ----------
  function parseQ(n) {
    const lines = sb(n).onscreen.split('\n').map(s => s.trim()).filter(Boolean);
    const opts = [], stem = [];
    lines.forEach(l => { const m = l.match(/^([A-D])\s{2,}(.*)$/); if (m) opts.push(m[2]); else stem.push(l); });
    return { stem, opts };
  }
  function parseFb(n) {
    const t = sb(n).onscreen;
    const c = (t.match(/CORRECT\n([\s\S]*?)(\n\nINCORRECT|$)/) || [])[1] || '';
    const w = (t.match(/INCORRECT\n([\s\S]*)$/) || [])[1] || '';
    const v = sb(n).vo;
    const vc = (v.match(/Correct feedback:\s*([\s\S]*?)(\n?Incorrect feedback:|$)/) || [])[1] || c;
    const vw = (v.match(/Incorrect feedback:\s*([\s\S]*)$/) || [])[1] || w;
    return { c: c.trim(), w: w.trim(), vc: vc.trim(), vw: vw.trim() };
  }
  const answerKey = n => { const m = sb(n).build.match(/ANSWER KEY:\s*([A-D])/); return m ? 'ABCD'.indexOf(m[1]) : -1; };
  const awareCue = n => { const m = sb(n).build.match(/AWARE cue:\s*([AWRE])\s*\(([^)]+)\)/); return m ? { L: m[1], w: m[2] } : null; };
  function cardLines(n) { // "TERM\ndesc"
    const t = sb(n).onscreen.split('\n');
    return [t[0], t.slice(1).join(' ').trim()];
  }

  // ---------- state ----------
  const state = { attempt: 1, i: 0, review: true, cc: true, narr: false, notes: true, added: true, gate: {}, quiz: {}, kcDone: {}, meera: {} };
  const qScreens = SCREENS.map((s, i) => s.layout === 'quiz' ? i : -1).filter(i => i >= 0);

  // ---------- chrome ----------
  function pathHTML(sec) {
    let h = '<div class="path" aria-hidden="true">';
    SECTIONS.forEach((s, k) => {
      const cls = sec == null ? (state.i > 3 ? 'done' : '') : k < sec ? 'done' : k === sec ? 'now' : '';
      h += `<span class="dot ${cls}">${k === sec ? `<span class="now-label">${esc(s.label)}</span>` : ''}</span>`;
      if (k < SECTIONS.length - 1) h += `<span class="seg ${sec != null && k < sec ? 'done' : (sec == null && state.i > 3 ? 'done' : '')}"></span>`;
    });
    return h + '</div>';
  }
  function badgeHTML(scr) {
    const c = scr.n.length ? awareCue(scr.n[0]) : null;
    return c ? `<div class="badge"><span>${esc(c.w)}</span><b>${c.L}</b></div>` : '';
  }
  // Title case for headings (course owner decision). Short articles, conjunctions and prepositions stay
  // lower case unless first, last, or after a colon or dash; acronyms (AI, LLM, AWARE) are kept as written.
  const MINOR = new Set(['a', 'an', 'the', 'and', 'but', 'or', 'nor', 'for', 'so', 'yet', 'as', 'at', 'by', 'in', 'of', 'on', 'to', 'up', 'via', 'vs', 'vs.', 'versus', 'with', 'from', 'into', 'per']);
  const capWord = w => w.replace(/^([^A-Za-z]*)([a-z])/, (m, p, c) => p + c.toUpperCase());
  const tc = str => {
    const words = String(str).split(' ');
    let startNext = true;
    return words.map((w, i) => {
      const bare = w.toLowerCase().replace(/[^a-z.]/g, '');
      const last = i === words.length - 1;
      let out;
      if (/[A-Z]/.test(w.slice(1)) || /^[^a-z]*$/.test(w)) out = w;                      // AI, LLM, R&R, 01
      else if (!startNext && !last && MINOR.has(bare)) out = w.toLowerCase();
      else out = w.split('-').map(capWord).join('-');
      startNext = /[:—–-]$/.test(w) || w === '—' || w === '–';
      return out;
    }).join(' ');
  };
  const head = (n, eyebrow) => `<div class="eyebrow">${esc(eyebrow || sb(n).section)}</div><h2 class="h in">${esc(tc(sb(n).title))}</h2>`;
  // entrance delay (stand-in for Storyline cue points); applied after render so it never clashes with inline styles
  const st = (i, base = 0.15, step = 0.35) => `data-d="${(base + i * step).toFixed(2)}"`;

  // ---------- layouts ----------
  const L = {};
  L.title = s => ({ dark: true, chrome: false, html: `
    <svg class="title-art" viewBox="0 0 560 560" aria-hidden="true">
      <circle cx="300" cy="280" r="220" fill="none" stroke="#497edc" stroke-width="2" stroke-dasharray="6 10"/>
      <circle cx="300" cy="280" r="150" fill="none" stroke="#497edc" stroke-width="2" stroke-dasharray="6 10"/>
