en choose herself","reply":"Exactly. AI supports the work. Meera owns it."},{"label":"Avoid AI completely","reply":"That is an option, but AI can save time on early ideas. This section shows where it helps."}],"vo":"Meera needs learning campaign ideas by Friday. A colleague suggests letting AI choose the campaign. How should she use AI here?"},"storyline":"Same opener pattern as slide 5."},{"n":[23],"layout":"pair","section":2,"cards":[["THINK","Explore ideas and possibilities"],["CREATE","Draft or generate content"]],"icons":["idea","draft"],"storyline":"Two large cards with light motion: an idea shape moves (motion path) from the THINK card into the CREATE card."},{"n":[24],"layout":"pair","section":2,"cards":[["UNDERSTAND","Summarize, explain, or clarify information"],["EXPLORE","Surface possibilities, themes, or questions"]],"icons":["doc","search"],"storyline":"Document and magnifying-glass icons (editable shapes or the supplied SVGs)."},{"n":[25],"layout":"twoCol","section":2,"left":["AI","AI can suggest, generate, organize, and assist."],"right":["HUMAN","The person still provides context, judgment, verification, and decisions."],"storyline":"Two columns. AI side uses the cool AI colour and outline style; human side uses the warm human colour and solid style. This colour rule is used across the whole course."},{"n":[26],"layout":"handoff","section":2,"ai":["Generate","Suggest","Organize"],"human":["Judge","Verify","Decide","Own"],"storyline":"An \"output\" card moves from the AI lane to the HUMAN lane on a motion path, then each human verb lights up (state change) in turn."},{"n":[27,28],"layout":"kc","section":2,"correct":1,"storyline":"Same knowledge-check pattern as slide 12."},{"n":[29],"layout":"opener","section":3,"sectionNo":4,"lines":["Pause before you trust the output.","Check accuracy. Consider fairness. Review use. Keep human accountability."],"meera":{"added":true,"situation":"An AI tool recommends which three employees should join a leadership programme. Meera's manager wants the list today.","question":"What is Meera's next step?","options":[{"label":"Forward the list as it is","reply":"This decision affects people, so it needs more than a forward. Let's look at why."},{"label":"Review the list for accuracy and fairness first","reply":"Right. When people are affected, review and accountability come first."},{"label":"Ask the AI for a longer list","reply":"A longer list still needs a person to review it and own the decision."}],"vo":"An AI tool has recommended three employees for a leadership programme, and Meera's manager wants the list today. What is her next step?"},"storyline":"Same opener pattern as slide 5."},{"n":[30],"layout":"steps","section":3,"steps":[["PAUSE","Do not accept the output automatically"],["CHECK","Identify claims that matter"],["VERIFY","Use an appropriate reliable source"]],"storyline":"Three-step horizontal process. Each step Fades in with its connector arrow on cue."},{"n":[31],"layout":"warning","section":3,"text":"An AI output can be fluent, polished, and still be wrong.","sub":"If the consequence matters, verify.","storyline":"A polished answer card (text lines drawn as grey bars, no readable fake facts) with a small ≠ warning marker that Pulses once. No alarming imagery."},{"n":[32],"layout":"balance","section":3,"cards":[["ASK","Could this output disadvantage someone?"],["REVIEW","Pay closer attention when people may be affected."]],"storyline":"Balance-scale icon above two cards. The scale tips gently (Spin emphasis, 5°) and settles."},{"n":[33],"layout":"checks3","section":3,"intro":"Before you use or share AI-generated content:","checks":["CHECK","REVIEW","CONFIRM"],"storyline":"Three check cards. Each gets a tick on its narration cue. Do not add legal claims."},{"n":[34],"layout":"gate","section":3,"text":"Do not delegate sensitive decisions or accountability to AI.","sub":"Especially when decisions affect people or carry significant consequences.","storyline":"Decision-gate visual: the AI path stops at a gate; only the human path continues through."},{"n":[35],"layout":"statement","section":3,"lines":["AI can assist.","Humans remain accountable."],"storyline":"Strong statement slide on the dark layout. Line 1 in the AI colour, line 2 in the human colour. Reused at the very end of the course."},{"n":[36,37],"layout":"kc","section":3,"correct":1,"storyline":"Same knowledge-check pattern as slide 12."},{"n":[38],"layout":"opener","section":4,"sectionNo":5,"lines":["Before you share information with an AI tool, stop and assess the information, the tool, and your permission to use it."],"meera":{"added":true,"situation":"Meera wants AI to help her draft feedback for a team member. The full performance review is open on her screen.","question":"What should Meera do before pasting anything?","options":[{"label":"Paste the whole review in","reply":"Being able to paste it doesn't mean she is allowed to. This section shows what to check."},{"label":"Check what she may share and whether the tool is approved","reply":"Yes. Information, tool and permission come before the prompt."},{"label":"Remove the name, then paste the rest","reply":"Better, but other details can still identify the person. She should check permission and the tool first."}],"vo":"Meera wants AI to help draft feedback for a team member, and the full performance review is open on her screen. What should she do before pasting anything?"},"storyline":"Same opener pattern as slide 5."},{"n":[39],"layout":"checklist","section":4,"items":["What information is it?","Who owns it?","Is the tool approved?","Am I permitted to use it?"],"instruction":"Select each question to tick it off.","instructionAdded":true,"storyline":"Four checklist rows, each a button with Normal and Selected (ticked) states. Next is enabled when all four are Selected. Make the list feel like a reusable mental checklist."},{"n":[40],"layout":"categories","section":4,"items":["CONFIDENTIAL","SENSITIVE","EMPLOYEE","CANDIDATE","PERSONAL"],"storyline":"Five simple category cards with a small lock motif. Recognition only, no policy detail."},{"n":[41],"layout":"threeGate","section":4,"parts":["APPROVED TOOL","PERMISSION","POLICY REQUIREMENTS"],"storyline":"Three-part gate: three bars that each turn to the \"open\" state on cue. Do not name internal tools."},{"n":[42],"layout":"stages","section":4,"stages":["Before input","During use","Before sharing output"],"sub":"Protect information at every stage.","storyline":"Three-stage process with a lock icon on each stage. A lock travels along the path (motion path)."},{"n":[43,44],"layout":"kc","section":4,"correct":1,"storyline":"Same knowledge-check pattern as slide 12."},{"n":[45],"layout":"opener","section":5,"sectionNo":6,"lines":["A useful prompt gives AI enough information to understand what you need."],"meera":{"added":true,"situation":"Meera typed \"Write an email\" and got something generic that she can't use.","question":"What should she try next?","options":[{"label":"Run the same prompt again","reply":"The same unclear request usually gives a similarly unclear result."},{"label":"Say who it is for, what it is about, and how long it should be","reply":"That's it. A clearer instruction gives AI a clearer target."},{"label":"Give up and write it herself","reply":"Sometimes that's fine. But a few extra details can make AI much more useful."}],"vo":"Meera typed \"Write an email\" and got something generic that she can't use. What should she try next?"},"storyline":"Same opener pattern as slide 5."},{"n":[46],"layout":"promptPart","section":5,"part":0,"parts":["CONTEXT","TASK","AUDIENCE","OUTPUT","CONSTRAINTS"],"storyline":"Prompt-builder pattern (slides 46–50): one big element card in the centre, and a five-slot builder bar at the bottom. On each slide one more slot fills in. Build slide 46 completely, then duplicate it four times and change only the text and which slot is filled."},{"n":[47],"layout":"promptPart","section":5,"part":1,"parts":["CONTEXT","TASK","AUDIENCE","OUTPUT","CONSTRAINTS"],"storyline":"Duplicate of slide 46 with the next builder slot filled."},{"n":[48],"layout":"promptPart","section":5,"part":2,"parts":["CONTEXT","TASK","AUDIENCE","OUTPUT","CONSTRAINTS"],"storyline":"Duplicate of slide 46 with the next builder slot filled."},{"n":[49],"layout":"promptPart","section":5,"part":3,"parts":["CONTEXT","TASK","AUDIENCE","OUTPUT","CONSTRAINTS"],"storyline":"Duplicate of slide 46 with the next builder slot filled."},{"n":[50],"layout":"promptPart","section":5,"part":4,"parts":["CONTEXT","TASK","AUDIENCE","OUTPUT","CONSTRAINTS"],"storyline":"Duplicate of slide 46 with the next builder slot filled."},{"n":[51],"layout":"assemble","section":5,"parts":["CONTEXT","TASK","AUDIENCE","OUTPUT","CONSTRAINTS"],"sub":"A clearer instruction gives AI a clearer target.","storyline":"The five builder slots fly up (motion paths) and lock together into one prompt bar. Then the subline Fades in."},{"n":[52],"layout":"compare","section":5,"vague":"Write an email.","clear":"Draft a 100-word professional reminder to employees to complete mandatory training by Friday.","highlights":[["100-word","length"],["professional","tone"],["reminder","what to create"],["employees","who it is for"],["by Friday","deadline"]],"storyline":"Side-by-side. On the CLEARER card, each added detail gets a highlight shape + small label on its narration cue (what to create, who it is for, length, tone, deadline)."},{"n":[53,54],"layout":"kc","section":5,"correct":2,"storyline":"Same knowledge-check pattern as slide 12."},{"n":[55],"layout":"opener","section":6,"sectionNo":7,"lines":["From a single response to a defined task"],"meera":{"added":true,"situation":"Every week, Meera turns her team's meeting notes into a summary using the same template.","question":"What could help most?","options":[{"label":"Ask a chatbot from scratch each week","reply":"It works, but she would repeat the same instructions every time."},{"label":"Set up an agent for this task, and review each output","reply":"Yes. An agent can carry out a defined task, and Meera still reviews the result."},{"label":"Set up an agent that sends summaries without review","reply":"An agent can complete a task without the result being correct. Review stays with Meera."}],"vo":"Every week, Meera turns her team's meeting notes into a summary using the same template. What could help most?"},"storyline":"Same opener pattern as slide 5."},{"n":[56],"layout":"agentModel","section":6,"text":"An AI agent is an AI system configured to carry out a defined task using:","inputs":["INSTRUCTIONS","CONTEXT","AVAILABLE CAPABILITIES"],"storyline":"Three inputs flow (Wipe arrows) into one \"defined task\" block. Keep it conceptual."},{"n":[57],"layout":"lanes","section":6,"chatbot":"You ask → AI responds","agent":"You define a task → Agent works through it","storyline":"Two lanes. Chatbot lane animates as one step; agent lane animates as a short sequence of 3–4 small steps."},{"n":[58],"layout":"atlasVideo","section":6,"process":["CREATE","CONFIGURE","TEST","REVIEW"],"note":"Use the approved Atlas environment for the demonstration.","storyline":"Insert > Video > From File: your Atlas screen recording. Add callouts (rounded rectangles) that point to the real Atlas interface labels. Do not invent labels. Show the four-step process bar above the video."},{"n":[59],"layout":"atlasSteps","section":6,"steps":["Define the task","Add instructions and context","Test with a sample situation","Review the output"],"storyline":"Four step cards. If you record one video per step, put each on its own layer and open it from the matching card."},{"n":[60],"layout":"tryIt","section":6,"tabs":[["SCENARIO","Talent meeting summary"],["INPUT","Sample meeting notes"],["TASK","Create a meeting summary using the Talent meeting-summary template"],["OUTPUT","Completed meeting summary"]],"notesTitle":"Sample meeting notes","notes":["Purpose: Business Writing Team Connect","The team reviewed the October Tip 3 content and finalized the version for sharing.","The finalized Tip 3 should be shared with the team. Owner: Team. Deadline: October 2.","Neha demonstrated the AI Agent Builder feature in Atlas and walked the team through an R&R Auditor Agent she created.","Neha will share the R&R Auditor Agent prompt and demonstration details with the team. Deadline: October 2.","Neha walked the team through the AI presentation prepared for Talent Development.","No announcements or minority views were recorded."],"renamed":"Karthika → Neha (fictional name, as you requested)","prompt":"Create a meeting summary using the Talent meeting-summary template. Review the meeting notes provided below and populate the relevant fields in the template. Capture meeting details, agenda items, descriptions, action items or next steps, responsible persons, deadlines, announcements, minority views and alternate opinions, outcomes of minority-view consideration, and additional notes when the information is provided. Use only information explicitly stated in the meeting notes. Do not infer or invent owners, deadlines, decisions, viewpoints, or other details. If a field is not supported by the notes, leave it blank or mark it as Not specified, according to the template requirement. Keep the wording concise and professional while preserving the meaning of the original notes.","check":"The completed summary should follow the Talent template structure and accurately reflect the source notes. The learner must review the output before using or sharing it.","actions":["Share the finalized October Tip 3 — Responsible Person: Team — Deadline: October 2","Share the R&R Auditor Agent prompt and demonstration details — Responsible Person: Neha — Deadline: October 2"],"review":["Did the agent capture the information that was actually provided?","Did it place the information in the correct sections of the Talent template?","Did it invent any owner, deadline, decision, or viewpoint?","Is the wording accurate and appropriate for a meeting summary?","What would you correct before sharing the summary?"],"storyline":"Base layer: four tab buttons (Scenario, Input, Task, Output). Each tab opens its own layer. Extra layers: \"Sample notes\", \"Right prompt for Atlas\", \"Expected output check\". Track visited tabs with True/False variables; enable Next when all four are visited. Optional: attach the Talent template and sample notes as Resources in the player."},{"n":[61,62],"layout":"kc","section":6,"correct":1,"storyline":"Same knowledge-check pattern as slide 12."},{"n":[63],"layout":"assessIntro","section":7,"lines":["Show what you know.","The assessment tests understanding and judgment, not simple recall."],"info":["8 questions","Pass mark 80% (7 of 8)","Unlimited attempts"],"infoAdded":true,"storyline":"Clean transition into the assessment. The three info chips are new: they tell learners the rules before they start."},{"n":[64,65],"layout":"quiz","section":7,"qNo":1,"correct":1,"storyline":"Graded Pick One question (Insert > New Slide > Quizzing > Graded Question > Pick One). Points: 10 each. Attempts: 1. Feedback: By Question, using the slide 65 text on the Correct and Incorrect layers. The Continue button on each layer goes to the next question. Do not shuffle answers."},{"n":[66,67],"layout":"quiz","section":7,"qNo":2,"correct":1,"storyline":"Same graded pattern as question 1."},{"n":[68,69],"layout":"quiz","section":7,"qNo":3,"correct":1,"storyline":"Same graded pattern as question 1."},{"n":[70,71],"layout":"quiz","section":7,"qNo":4,"correct":1,"storyline":"Same graded pattern as question 1."},{"n":[72,73],"layout":"quiz","section":7,"qNo":5,"correct":2,"storyline":"Same graded pattern as question 1."},{"n":[74,75],"layout":"quiz","section":7,"qNo":6,"correct":1,"storyline":"Same graded pattern as question 1."},{"n":[76,77],"layout":"quiz","section":7,"qNo":7,"correct":1,"storyline":"Same graded pattern as question 1."},{"n":[78,79], 4,76,78],"text":"Three assessment questions repeat earlier knowledge checks almost word for word (Q1 ≈ slide 12, Q7 ≈ slide 27, Q8 ≈ slide 61). This tests recall, which slide 63 says the assessment avoids.","fix":"Rewrite Q1, Q7 and Q8 as new workplace scenarios."},{"slides":[64,66,68,70,72,74,76,78],"text":"Several wrong options are obviously wrong (for example \"Password management\", \"File compression\", \"A static report\"), so learners can answer without understanding.","fix":"Replace them with believable mistakes people actually make."},{"slides":[65,67,69,71,73,75,77,79],"text":"All 8 assessment feedback layers use identical text. The correct-answer text (\"keeps the appropriate human role\") does not fit Q1, Q5 or Q8.","fix":"Write one specific sentence of feedback per question."},{"slides":[63],"text":"Slide 63 says \"Eight scenario-based questions follow\", but Q5 and Q8 are not scenarios.","fix":"Reword the build note, or turn Q5 and Q8 into scenarios."},{"slides":[58,59],"text":"Slide 58 names the steps Create → Configure → Test → Review; slide 59 calls them Define → Add instructions and context → Test → Review.","fix":"Use one set of step names on both slides."},{"slides":[27,76],"text":"Grammar: \"a candidate suitability\" should be \"a candidate's suitability\".","fix":"Add the apostrophe."},{"slides":[33],"text":"Grammar in voiceover: \"your organization expectations\" should be \"your organization's expectations\". Also check: the AI voice will read \"R&R\" literally.","fix":"Add the apostrophe."},{"slides":[60],"text":"Slide 60 holds more content than one screen can show (scenario, notes, prompt, expected output).","fix":"Already handled in this design with tabs and layers. No wording changed."},{"slides":[12,20,27,36,43,53,61],"text":"The storyboard does not say whether a wrong knowledge-check answer can be retried.","fix":"This design uses Try Again until correct. Confirm."}]};</script>
<script>
/* AI Literacy Level 1 — clickable prototype. Data: window.SB (signed-off storyboard), window.D (design layer). */
(function () {
  const SB = {}; window.SB.forEach(r => { SB[r.n] = r; });
  const { SECTIONS, CHARACTER, SCREENS, FLAGS } = window.D;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sb = n => SB[n] || { title: '', onscreen: '', vo: '', build: '' };

  // ---------- icons (same shapes ship in the asset pack) ----------
  const I = {
    warn: '<svg viewBox="0 0 48 48" fill="none" stroke="#2a6f97" stroke-width="3" stroke-linejoin="round"><path d="M24 6 44 41H4Z"/><path d="M24 19v11M24 35v1" stroke-linecap="round"/></svg>',
    balance: '<svg viewBox="0 0 48 48" fill="none" stroke="#2a6f97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6v36M12 42h24M8 14h32"/><path d="M8 14 3 28h10ZM40 14l-5 14h10Z"/></svg>',
    agent: '<svg viewBox="0 0 48 48" fill="none" stroke="#2a6f97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="14" width="32" height="24" rx="6"/><path d="M24 6v8M18 26h.01M30 26h.01M4 24v6M44 24v6"/></svg>',
    idea: '<svg viewBox="0 0 48 48" fill="none" stroke="#2a6f97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M17 30a12 12 0 1 1 14 0v6H17Z"/><path d="M19 42h10"/></svg>',
    draft: '<svg viewBox="0 0 48 48" fill="none" stroke="#2a6f97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h20l8 8v28H10Z"/><path d="M16 22h16M16 29h16M16 36h9"/></svg>',
    doc: '<svg viewBox="0 0 48 48" fill="none" stroke="#2a6f97" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h20l8 8v28H10Z"/><path d="M30 6v8h8M16 24h16M16 31h12"/></svg>',
    search: '<svg viewBox="0 0 48 48" fill="none" stroke="#2a6f97" stroke-width="3" stroke-linecap="round"><circle cx="21" cy="21" r="12"/><path d="m30 30 12 12"/></svg>',
    lock: c => `<svg viewBox="0 0 48 48" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="21" width="30" height="21" rx="4"/><path d="M15 21v-6a9 9 0 0 1 18 0v6M24 30v4"/></svg>`,
    open: '<svg viewBox="0 0 48 48" fill="none" stroke="#2f8a5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="21" width="30" height="21" rx="4"/><path d="M15 21v-6a9 9 0 0 1 17-4"/><path d="m18 31 4 4 8-8"/></svg>',
    play: '<svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7Z" fill="#172036"/></svg>',
    sys: '<svg viewBox="0 0 48 48" fill="none" stroke="#2a6f97" stroke-width="3"><rect x="8" y="8" width="32" height="32" rx="8"/><circle cx="24" cy="24" r="6"/></svg>',
  };
  const MEERA = `<svg viewBox="0 0 160 160" width="150" height="150" role="img" aria-label="Meera">
    <circle cx="80" cy="80" r="78" fill="#fbf0dc"/>
    <path d="M30 150c4-30 24-46 50-46s46 16 50 46Z" fill="#2a6f97"/>
    <path d="M66 100h28v14c-4 6-24 6-28 0Z" fill="#9c6b4a"/>
    <circle cx="80" cy="70" r="30" fill="#b07a55"/>
    <path d="M48 70c0-24 14-38 33-38s31 14 31 34c-10-2-22-10-28-20-6 12-20 22-36 24Z" fill="#1e1a22"/>
    <circle cx="104" cy="42" r="12" fill="#1e1a22"/>
    <circle cx="70" cy="74" r="2.6" fill="#1e1a22"/><circle cx="91" cy="74" r="2.6" fill="#1e1a22"/>
    <path d="M72 86c5 4 11 4 16 0" stroke="#5a3826" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="80.5" cy="60" r="2" fill="#c4523b"/>
  </svg>`;

  // ---------- parsing helpers for signed-off text ----------
  function parseQ(n) {
    const lines = sb(n).onscreen.split('\n').map(s => s.trim()).filter(Boolean);
    const opts = [], stem = [];
    lines.forEach(l => { const m = l.match(/^([A-D])\s{2,}(.*)$/); if (m) opts.push(m[2]); else stem.push(l); });
    return { stem, opts };
  }
  function parseFb(n) {
    const t = sb(n).onscreen;
    const c = (t.match(/CORRECT\n([\s\S]*?)(\n\nINCORRECT|$)/) || [])[1] || '';
    const w = (t.match(/INCORRECT\n([\s\S]*)$/) || [])[1] || '';
    const v = sb(n).vo;
    const vc = (v.match(/Correct feedback:\s*([\s\S]*?)(\n?Incorrect feedback:|$)/) || [])[1] || c;
    const vw = (v.match(/Incorrect feedback:\s*([\s\S]*)$/) || [])[1] || w;
    return { c: c.trim(), w: w.trim(), vc: vc.trim(), vw: vw.trim() };
  }
  function cardLines(n) { // "TERM\ndesc"
    const t = sb(n).onscreen.split('\n');
    return [t[0], t.slice(1).join(' ').trim()];
  }

  // ---------- state ----------
  const state = { i: 0, review: true, cc: true, narr: false, notes: true, added: true, gate: {}, quiz: {}, kcDone: {}, meera: {} };
  const qScreens = SCREENS.map((s, i) => s.layout === 'quiz' ? i : -1).filter(i => i >= 0);

  // ---------- chrome ----------
  function pathHTML(sec) {
    let h = '<div class="path" aria-hidden="true">';
    SECTIONS.forEach((s, k) => {
      const cls = sec == null ? (state.i > 3 ? 'done' : '') : k < sec ? 'done' : k === sec ? 'now' : '';
      h += `<span class="dot ${cls}">${k === sec ? `<span class="now-label">${esc(s.label)}</span>` : ''}</span>`;
      if (k < SECTIONS.length - 1) h += `<span class="seg ${sec != null && k < sec ? 'done' : (sec == null && state.i > 3 ? 'done' : '')}"></span>`;
    });
    return h + '</div>';
  }
  function badgeHTML(sec) {
    if (sec == null || !SECTIONS[sec].aware) return '';
    return `<div class="badge"><span>${esc(SECTIONS[sec].awareWord)}</span><b>${SECTIONS[sec].aware}</b></div>`;
  }
  const head = (n, eyebrow) => `<div class="eyebrow">${esc(eyebrow || sb(n).section)}</div><h2 class="h in">${esc(sb(n).title)}</h2>`;
  // entrance delay (stand-in for Storyline cue points); applied after render so it never clashes with inline styles
  const st = (i, base = 0.15, step = 0.35) => `data-d="${(base + i * step).toFixed(2)}"`;

  // ---------- layouts ----------
  const L = {};
  L.title = s => ({ dark: true, chrome: false, html: `
    <svg class="title-art" viewBox="0 0 560 560" aria-hidden="true">
      <circle cx="300" cy="280" r="220" fill="none" stroke="#2a6f97" stroke-width="2" stroke-dasharray="6 10"/>
      <circle cx="300" cy="280" r="150" fill="none" stroke="#2a6f97" stroke-width="2" stroke-dasharray="6 10"/>
      <circle cx="300" cy="280" r="80" fill="#d9952b"/>
      <circle cx="520" cy="280" r="10" fill="#7fb6d8"/><circle cx="150" cy="170" r="10" fill="#7fb6d8"/><circle cx="300" cy="430" r="10" fill="#7fb6d8"/>
    </svg>
    <div class="content title-slide" style="justify-content:center">
      <div class="level in">${esc(sb(1).onscreen.split('\n')[0].toUpperCase())}</div>
      <h2 class="big in" ${st(1, .1, .2)}>AI<br><span>LITERACY</span></h2>
      <div class="tag in" ${st(2, .1, .3)}>${esc(sb(1).onscreen.split('\n')[1]).replace('Use It Responsibly.', '<b>Use It Responsibly.</b>')}</div>
    </div>` });

  L.outcomes = s => ({ html: `<div class="content">${head(2, 'Before we begin')}
    <p class="lead in" style="margin-bottom:18px">${esc(s.intro)}</p>
    <div>${s.items.map((t, k) => `<div class="outcome in" ${st(k, .5, .6)}><span class="num">${k + 1}</span><span>${esc(t)}</span></div>`).join('')}</div></div>` });

  L.journey = s => ({ html: `<div class="content">${head(3, 'Your route')}
    <div class="jpath">${s.steps.map((t, k) => `<div class="jstop in" ${st(k, .3, .25)}><div class="n">${k + 1}</div><div class="t">${esc(t)}</div></div>`).join('')}</div></div>` });

  L.aware = s => ({ dark: true, html: `<div class="content"><div class="eyebrow">Your mental model</div><h2 class="h in" style="color:#fff">${esc(sb(4).title)}</h2>
    <div class="aware">${s.letters.map(([l, w], k) => `<div class="aw" ${st(k, .4, .5)}><div class="L">${l}</div><div class="w" style="color:#e6ebf3">${esc(w)}</div></div>`).join('')}</div></div>` });

  L.opener = (s, idx) => {
    const n = s.n[0];
    const done = state.meera[idx] != null;
    return { dark: true, gate: done, html: `<div class="content opener">
      <div class="secno in">${String(s.sectionNo).padStart(2, '0')}</div>
      <h2 class="h in" ${st(1, .1, .2)}>${esc(sb(n).title)}</h2>
      <ul>${s.lines.map((t, k) => `<li class="in" ${st(k, .5, .4)}>${esc(t)}</li>`).join('')}</ul>
      ${s.meera ? `<button class="navbtn next meera-cta in" ${st(0, 1.6)} data-act="meera">${done ? 'Revisit' : 'Meet'} ${CHARACTER.name}'s moment</button>` : ''}
    </div>${s.meera && state.layer === 'meera' ? meeraLayer(s, idx) : ''}`, after: el => {
      if (s.meera && !done && state.layer !== 'meera' && !state.autoMeera[idx]) { state.autoMeera[idx] = true; setTimeout(() => { if (state.i === idx) { state.layer = 'meera'; render(); speak(s.meera.vo); } }, 2600); }
    } };
  };
  function meeraLayer(s, idx) {
    const m = s.meera, pick = state.meera[idx];
    return `<div class="layer"><span class="added-tag" style="left:24px;top:64px">NEW · NEEDS APPROVAL</span><div class="panel">
      <div class="meera-fig">${MEERA}<div class="nm">${CHARACTER.name}</div><div class="rl">${CHARACTER.role}</div></div>
      <div><p class="sit">${esc(m.situation)}</p><p class="q">${esc(m.question)}</p>
        <div class="choices">${m.options.map((o, k) => `<button class="choice ${pick === k ? 'sel' : ''}" data-act="mpick" data-k="${k}">${esc(o.label)}</button>`).join('')}</div>
        ${pick != null ? `<div class="reply">${esc(m.options[pick].reply)}</div><button class="navbtn next" style="margin-top:16px" data-act="mclose">Continue</button>` : ''}
      </div></div></div>`;
  }

  L.defineCards = s => ({ html: `<div class="content">${head(6)}
    <div class="define">${s.caps.map((c, k) => `<div class="capc in" ${st(k, .8, .5)}>${esc(c)}</div>`).join('')}
      <div class="core in"><span class="term">AI</span>${esc(s.definition)}</div></div></div>` });

  L.umbrella = s => ({ html: `<div class="content">${head(7)}
    <div class="umb-top" style="animation-delay:1.6s">AI</div>
    <div class="umb">${Array.from({ length: s.tiles }, (_, k) => `<div class="tile in" ${st(k, .2, .15)}>${I.sys}</div>`).join('')}</div>
    <p class="lead in" ${st(0, 2)} style="margin-top:22px"><b>${esc(s.statement)}</b> ${esc(s.sub)}</p></div>` });

  L.radial = s => {
    const pos = [[18, 25], [82, 25], [10, 78], [90, 78], [50, 96]];
    return { html: `<div class="content">${head(8)}<p class="lead in">${esc(s.definition)}</p>
      <div class="radial"><div class="hub">Gen<br>AI</div>${s.types.map((t, k) => `<span class="chip" style="left:${pos[k][0]}%;top:${pos[k][1]}%;animation-delay:${.6 + k * .3}s">${t}</span>`).join('')}</div></div>` };
  };

  L.flow = s => ({ html: `<div class="content">${head(9)}<p class="lead in">${esc(s.text)}</p>
    <div class="flow">
      <div class="node data in" ${st(0, .4)}><div class="dots">${'<i></i>'.repeat(24)}</div>${esc(s.nodes[0])}</div>
      <div class="arrow" style="animation-delay:.9s"></div>
      <div class="node model in" ${st(0, 1.2)}>${esc(s.nodes[1])}</div>
      <div class="arrow" style="animation-delay:1.7s"></div>
      <div class="node resp in" ${st(0, 2)}><div class="lines-skel"><i></i><i></i><i style="width:60%"></i></div>${esc(s.nodes[2])}</div>
    </div></div>` });

  L.reveal = (s, idx) => {
    const open = state.gate[idx] || [];
    const all = open.length === s.cards.length;
    return { gate: all, html: `<div class="content">${head(s.n[0])}
      <div class="reveal-row" style="grid-template-columns:repeat(${s.cards.length},1fr)">${s.cards.map(([t, d], k) => {
        const o = open.includes(k);
        return `<button class="rcard in ${o ? 'open' : ''}" ${st(k, .3, .2)} data-act="rev" data-k="${k}" aria-expanded="${o}">
          ${s.icons ? I[s.icons[k]] : ''}<span class="term">${esc(t)}</span>${o ? `<span class="def">${esc(d)}</span>` : '<span class="hint">Select to reveal</span>'}</button>`;
      }).join('')}</div>
      <div class="instr">${esc(s.instruction)} <span class="added-tag" style="position:static">NEW</span></div></div>` };
  };

  L.beforeAfter = s => ({ html: `<div class="content">${head(15)}<div class="ba">
    <div><div class="vis"><div class="page blank in"><i></i></div><span class="arr">→</span><div class="page ai in" ${st(0, .9)}><i></i><i></i><i></i><i style="width:70%"></i><i></i><i style="width:50%"></i></div></div>
      <div class="card ai in" ${st(0, 1)}><span class="term">${esc(s.cards[0][0])}</span><p>${esc(s.cards[0][1])}</p></div></div>
    <div><div class="vis"><div class="page in" ${st(0, 1.6)}><i></i><i></i><i></i><i></i><i></i></div><span class="arr">→</span><div class="page ai in" ${st(0, 2)}><i style="width:40%"></i><i></i><i style="width:40%"></i><i></i><i style="width:40%"></i></div></div>
      <div class="card ai in" ${st(0, 2.2)}><span class="term">${esc(s.cards[1][0])}</span><p>${esc(s.cards[1][1])}</p></div></div></div></div>` });

  L.condense = s => ({ html: `<div class="content">${head(16)}
    <div class="condense-vis"><div class="page long in">${'<i></i>'.repeat(14)}</div><span class="arr">→</span>
      <div class="page ai short in" ${st(0, .9)}><i></i><i></i><i style="width:60%"></i></div><span class="arr in" ${st(0, 1.4)}>→</span>
      <div class="page ai list in" ${st(0, 1.6)}><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="ba">${s.cards.map(([t, d], k) => `<div class="card ai in" ${st(k, .8, .9)}><span class="term">${esc(t)}</span><p>${esc(d)}</p></div>`).join('')}</div></div>` });

  L.pattern = s => {
    const pts = [[60, 60], [90, 110], [130, 70], [210, 220], [250, 260], [190, 270], [330, 90], [370, 130], [350, 60], [80, 260], [300, 250], [150, 150]];
    const grp = [0, 0, 0, 1, 1, 1, 2, 2, 2, 1, 1, 0];
    const cen = [[110, 90], [250, 240], [360, 100]];
    return { html: `<div class="content">${head(17)}<div class="pattern">
      <svg viewBox="0 0 440 330" aria-hidden="true">${cen.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="62" fill="#e3eef5" stroke="#2a6f97" stroke-width="2" stroke-dasharray="5 6" class="in" style="animation-delay:1.4s"/>`).join('')}
        ${pts.map(([x, y], k) => { const [cx, cy] = cen[grp[k]]; const tx = cx + ((k * 37) % 50) - 25, ty = cy + ((k * 23) % 50) - 25; return `<circle r="9" fill="#2a6f97" cx="${tx}" cy="${ty}"><animate attributeName="cx" from="${x}" to="${tx}" dur="1.2s" begin="0.2s" fill="freeze"/><animate attributeName="cy" from="${y}" to="${ty}" dur="1.2s" begin="0.2s" fill="freeze"/></circle>`; }).join('')}
      </svg>
      <div class="card ai in" ${st(0, 1.6)}><span class="term" style="font-size:20px">${esc(s.card[0])}</span><p style="font-size:26px">${esc(s.card[1])}</p></div></div></div>` };
  };

  L.limits = s => ({ html: `<div class="content">${head(18)}<div class="limits"><p class="lead">${esc(s.intro)}</p>
    <ul>${s.items.map((t, k) => `<li class="in" ${st(k, .5, .5)}><span class="x">✕</span>${esc(t)}</li>`).join('')}</ul></div></div>` });

  L.notEqual = s => ({ html: `<div class="content">${head(19)}<div class="neq">
    <div class="side l in">${esc(s.left)}</div><div class="sym">≠</div><div class="side r in" ${st(0, .5)}>${esc(s.right)}</div></div></div>` });

  function optsHTML(q, sel, locked) {
    return `<div class="opts">${q.opts.map((o, k) => `<button class="opt ${sel === k ? 'sel' : ''}" data-act="opt" data-k="${k}" ${locked ? 'disabled' : ''} aria-pressed="${sel === k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}
      <button class="navbtn next submit" data-act="submit" ${sel == null || locked ? 'disabled' : ''}>Submit</button></div>`;
  }
  L.kc = (s, idx) => {
    const q = parseQ(s.n[0]), fb = parseFb(s.n[1]);
    const k = state.kc[idx] || {};
    const res = k.result;

    const b = e.target.closest('[data-act]'); if (!b) return;
    const s = SCREENS[state.i], act = b.dataset.act, k = +b.dataset.k;
    if (act === 'next') { const nx = state.i + 1; go(nx); }
    else if (act === 'prev') go(state.i - 1);
    else if (act === 'cc') { state.cc = !state.cc; render(); }
    else if (act === 'meera') { state.layer = 'meera'; render(); speak(s.meera.vo); }
    else if (act === 'mpick') { state.meera[state.i] = k; render(); speak(s.meera.options[k].reply); }
    else if (act === 'mclose') { state.layer = null; render(); }
    else if (act === 'rev') { const g = state.gate[state.i] || []; if (!g.includes(k)) g.push(k); state.gate[state.i] = g; render(); }
    else if (act === 'hl') { state.gate[state.i] = true; render(); }
    else if (act === 'tab') { const g = state.gate[state.i]; g.cur = k; if (!g.seen.includes(k)) g.seen.push(k); render(); }
    else if (act === 'copy') { const t = s.prompt; navigator.clipboard && navigator.clipboard.writeText(t).then(() => { b.textContent = 'Copied'; }).catch(() => { const r = document.createRange(); r.selectNodeContents($('#prompt-box')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = 'Selected: press Ctrl+C'; }); }
    else if (act === 'opt') { const store = s.layout === 'quiz' ? state.quiz : state.kc; const a = store[state.i] || {}; a.sel = k; store[state.i] = a; render(); }
    else if (act === 'submit') cur.onSubmit();
    else if (act === 'retry') { state.kc[state.i] = {}; render(); }
    else if (act === 'retake') { qScreens.forEach(i => delete state.quiz[i]); go(qScreens[0]); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest('select')) return;
    if (e.key === 'ArrowRight' && !$('[data-act="next"]').disabled) go(state.i + 1);
    if (e.key === 'ArrowLeft' && state.i > 0) go(state.i - 1);
  });

  // ---------- toolbar ----------
  const jump = $('#jump');
  jump.innerHTML = SCREENS.map((s, i) => `<option value="${i}">${i + 1}. ${esc(s.n.length ? sb(s.n[0]).title : 'Assessment results (new)')}${s.n.length > 1 ? ' + feedback' : ''}</option>`).join('');
  jump.addEventListener('change', () => go(+jump.value));
  const tog = (id, key, fn) => { const b = $(id); b.setAttribute('aria-pressed', state[key]); b.addEventListener('click', () => { state[key] = !state[key]; b.setAttribute('aria-pressed', state[key]); fn && fn(); render(); }); };
  tog('#t-review', 'review', () => { jump.disabled = !state.review; });
  tog('#t-notes', 'notes', () => $('.main').classList.toggle('no-notes', !state.notes));
  tog('#t-added', 'added');
  tog('#t-narr', 'narr', () => { if (state.narr) speak(screenVO(SCREENS[state.i])); else { try { speechSynthesis.cancel(); } catch (e) { /* none */ } } });

  // scale stage to its wrapper
  const wrap = $('.stage-wrap');
  const fit = () => { $('#stage').style.transform = `scale(${wrap.clientWidth / 1280})`; };
  new ResizeObserver(fit).observe(wrap); fit();

  const start = Math.max(0, SCREENS.findIndex((s, i) => location.hash === '#s' + (i + 1)));
  go(start);
})();

</script>
