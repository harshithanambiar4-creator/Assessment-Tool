# Lets Render set the site up automatically ("New → Blueprint"). See README.md, step 5.
services:
  - type: web
    runtime: static
    name: live-assessment-writer
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
